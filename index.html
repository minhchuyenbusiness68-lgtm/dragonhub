<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dragon Hub">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Dragon Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cormorant+Garamond:wght@600;700&display=swap">
<style>
/* Layout: two views share one org tree. "Sơ đồ" has links that open each sheet. "Báo cáo thường kì" has the same tree where each box opens a report sheet for the chosen period (tuần, tháng, quý, năm). Phone: vertical tree with a gold spine. 760px+: horizontal tree. Report opens as a bottom sheet on phones and a centered dialog on wide screens. Light only on purpose: white and muted gold. */
:root{
  --bg:#FFFFFF;
  --surface:#FAF8F3;
  --surface-2:#F2EDE0;
  --ink:#2B2314;
  --muted:#6E6552;
  --line:#C9A460;
  --hair:#E7E0CE;
  --gold:#C9A460;
  --gold-deep:#8F6D2E;
  --gold-soft:#F6EFDD;
  --ok:#3F7A4E;
  --bad:#A5473A;
  --warn:#9A5B1B;
  --n-board:#D9B872;
  --n-brand:#BFDDE2;
  --n-fin:#D3D1CC;
  --n-inv:#F1CFA2;
  --n-nw:#F8E6CC;
  --n-legal:#EDEBE6;
  --edge:rgba(43,35,20,.14);
  --font-display:'Cormorant Garamond','Iowan Old Style',Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;min-height:100vh;-webkit-text-size-adjust:100%;
}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 40px;min-width:0}
h1,h2,h3,p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold-deep);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.ok{color:var(--ok)}
.bad{color:var(--bad)}
.warn{color:var(--warn)}

.hd{display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.hd img{height:52px;width:auto;display:block;flex:none}
.hd .grow{flex:1;min-width:0}
.brand{font-family:var(--font-display);font-weight:700;letter-spacing:.07em;font-size:21px;color:var(--gold-deep);line-height:1.1}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.linkbtn{background:none;border:0;padding:8px 0;color:var(--gold-deep);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:44px}
.btn{min-height:48px;border-radius:10px;padding:12px 18px;border:1px solid var(--gold-deep);background:var(--bg);color:var(--gold-deep);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.block{width:100%}

/* tree */
.org{margin-top:24px}
ul{list-style:none;margin:0;padding:0}
.node{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:60px;padding:10px 14px;border-radius:10px;width:100%;text-align:left;
  border:1px solid var(--edge);text-decoration:none;color:var(--ink);font-weight:600;font-size:13.5px;letter-spacing:.03em;line-height:1.3;
  transition:transform .15s ease,box-shadow .15s ease}
.node:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(43,35,20,.12)}
.node:active{transform:translateY(0)}
.node .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.node .cap{font-size:12px;font-weight:500;letter-spacing:0;color:var(--muted)}
.node .go{font-size:16px;color:var(--gold-deep);flex:none;font-weight:500}
.node.sel{outline:2px solid var(--gold-deep);outline-offset:2px}
.board{background:var(--n-board)}
.brandn{background:var(--n-brand)}
.fin{background:var(--n-fin)}
.inv{background:var(--n-inv)}
.nw{background:var(--n-nw)}
.legal{background:var(--n-legal)}

.kids{margin:12px 0 0 22px;padding-left:22px}
.kids>li{position:relative;margin-top:12px}
.kids>li:first-child{margin-top:0}
.kids>li::before{content:"";position:absolute;left:-22px;top:-12px;width:2px;height:calc(100% + 12px);background:var(--line)}
.kids>li:last-child::before{height:calc(30px + 12px)}
.kids>li::after{content:"";position:absolute;left:-22px;top:30px;width:22px;height:2px;background:var(--line)}

.actions{margin-top:26px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--hair);display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:space-between}
.foot .hint{font-size:13px;color:var(--muted)}
.foot a{font-size:14px;font-weight:600;color:var(--gold-deep);text-underline-offset:3px}

/* period controls */
.seg{display:flex;border:1px solid var(--gold);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:44px;background:var(--bg);border:0;color:var(--gold-deep);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink);font-weight:600}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 2px}
.pnav .p{text-align:center;min-width:0}
.pnav .p .h3{display:block;font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1.15}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--hair);background:var(--bg);display:grid;place-items:center;font-size:18px;color:var(--gold-deep);flex:none}
.iconbtn[disabled]{opacity:.35;cursor:default}
.pc{margin-top:20px;max-width:560px;margin-inline:auto}

/* report sheet */
.scrim{position:fixed;inset:0;background:rgba(43,35,20,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:16px 16px 0 0;max-height:90vh;display:flex;flex-direction:column;
  box-shadow:0 -8px 30px rgba(43,35,20,.25);animation:up .25s ease both}
.sheet .sh-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-radius:16px 16px 0 0;border-bottom:1px solid var(--edge)}
.sheet .sh-hd .nm{font-weight:600;letter-spacing:.03em;font-size:14px;min-width:0}
.sheet .sh-hd .sc{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}
.sheet .sh-bd{overflow:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(600px,92vw);max-height:86vh;transform:translate(-50%,-50%);border-radius:16px;animation:pop .2s ease both}
  .sheet .sh-hd{border-radius:16px 16px 0 0}
}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}to{opacity:1;transform:translate(-50%,-50%)}}

.mgrp{margin-top:18px}
.mgrp>.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);font-weight:600;margin-bottom:4px}
.m{padding:12px 0;border-top:1px solid var(--hair)}
.m:first-of-type{border-top:0}
.m .mt{font-weight:600}
.m .mv{font-family:var(--font-display);font-size:34px;font-weight:600;line-height:1.1;font-variant-numeric:lining-nums tabular-nums;overflow-wrap:anywhere}
.m .mv .mu{font-family:var(--font-body);font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
.mrow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:2px 0}
.mrow span{color:var(--muted)}
.mrow b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
.bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:999px}
.note{background:var(--gold-soft);border:1px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
.empty{padding:24px 0;text-align:center}
.empty .h3{font-family:var(--font-display);font-size:26px;font-weight:600}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--gold);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

@media (min-width:760px){
  .root{display:flex;flex-direction:column;align-items:center}
  .root>.node{width:min(320px,100%)}
  .kids{display:flex;justify-content:center;gap:16px;margin:0;padding:24px 0 0;width:100%;position:relative}
  .kids::before{content:"";position:absolute;left:50%;top:0;width:2px;height:24px;margin-left:-1px;background:var(--line)}
  .kids>li{flex:1 1 0;min-width:0;max-width:230px;margin:0;padding-top:24px;position:relative;display:flex;flex-direction:column}
  .kids>li:first-child{margin:0}
  .kids>li::before{left:-8px;right:-8px;top:0;width:auto;height:2px;background:var(--line)}
  .kids>li:first-child::before{left:50%;top:0;height:2px}
  .kids>li:last-child::before{left:-8px;right:50%;height:2px}
  .kids>li:only-child::before{display:none}
  .kids>li::after{left:50%;top:0;width:2px;height:24px;margin-left:-1px}
  .kids .kids{padding-top:24px;margin:0;width:100%;justify-content:center}
  .kids .kids::before{height:24px}
  .kids .kids>li{padding-top:0;max-width:none}
  .kids .kids>li::before,.kids .kids>li::after{display:none}
  .node{min-height:72px}
  .actions{flex-direction:row;justify-content:center}
  .actions .btn{min-width:260px}
}

/* opening animation */
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  animation:spOut .45s ease 3.1s forwards;cursor:pointer}
.splash .stage{position:relative;width:230px;height:230px;display:grid;place-items:center}
.splash .ringw{position:absolute;inset:0;animation:ringOut .5s ease 1.55s forwards}
.splash .ringw::before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid var(--gold-soft)}
.splash .ring{position:absolute;inset:0;animation:spin 1.8s cubic-bezier(.4,.1,.25,1) both}
.splash .trail{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(201,164,96,0) 0deg,rgba(201,164,96,0) 190deg,rgba(201,164,96,.95) 360deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}
.splash .head{position:absolute;top:-5px;left:calc(50% - 7px);width:14px;height:14px;border-radius:50%;background:#F6E3A8;box-shadow:0 0 16px 5px rgba(201,164,96,.75)}
.splash .mark2{position:relative;height:150px;width:auto;opacity:0;animation:reveal .9s cubic-bezier(.2,.7,.2,1) 1.4s forwards}
.splash .word{font-family:var(--font-display);font-weight:700;color:var(--gold-deep);font-size:26px;letter-spacing:.07em;padding-left:.07em;opacity:0;animation:word .6s ease 1.9s forwards}
.splash .tap{position:absolute;bottom:max(24px,env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);letter-spacing:.06em}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(720deg)}}
@keyframes ringOut{to{opacity:0;transform:scale(.8)}}
@keyframes reveal{0%{opacity:0;clip-path:circle(0% at 50% 50%);transform:scale(.88)}25%{opacity:1}100%{opacity:1;clip-path:circle(80% at 50% 50%);transform:scale(1)}}
@keyframes word{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){
  .node{transition:none}
  .sheet{animation:none}
  .spin{animation:none}
}

/* apple-like refinements */
body{letter-spacing:-.003em}
.node{justify-content:center;text-align:center;position:relative;padding:12px 34px;border-radius:14px;border-color:transparent;box-shadow:0 1px 2px rgba(43,35,20,.08)}
.node .t{align-items:center}
.node .go{position:absolute;right:14px;top:50%;transform:translateY(-50%)}
.seg{background:#F1EEE6;border:0;border-radius:11px;padding:2px;gap:2px}
.seg button{min-height:38px;border-radius:9px;background:transparent;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.pnav .p .h3,.empty .h3{font-family:var(--font-body);font-weight:600;font-size:21px;letter-spacing:-.015em}
.sheet{border-radius:20px 20px 0 0}
.sheet .sh-hd{border-radius:20px 20px 0 0}
.tw{overflow-x:auto;margin:16px -4px 0;-webkit-overflow-scrolling:touch}
.tb{border-collapse:separate;border-spacing:0;width:100%;min-width:max-content;font-size:14px}
.tb th,.tb td{padding:12px 8px;border-bottom:1px solid var(--hair);white-space:nowrap;text-align:right;font-weight:400}
.tb thead th{font-size:12px;color:var(--muted);font-weight:500;padding-top:6px;padding-bottom:8px}
.tb th:first-child{text-align:left;position:sticky;left:0;background:var(--bg);font-weight:600;white-space:normal;min-width:84px;max-width:100px;z-index:1;box-shadow:6px 0 8px -8px rgba(43,35,20,.18)}
.tb thead th:first-child{font-weight:500}
.tb th small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.tb td{font-variant-numeric:tabular-nums}
.tb td.t1{font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.pill.up{color:#2F7D57;background:rgba(52,168,110,.13)}
.pill.down{color:#B2503F;background:rgba(214,90,70,.13)}
.pill.flat{color:var(--muted);background:#F1EEE6}
.kv{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair);font-size:14px}
.kv span{color:var(--muted)}
.kv b{font-weight:600}
.tt{margin:22px 0 0;font-size:13px;font-weight:600;color:var(--gold-deep)}
.cov{margin:14px 0 0;text-align:center;font-size:12.5px;color:var(--muted)}

/* app-like: no zoom, no rubber-band, no text selection */
html{touch-action:manipulation;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}
/* passcode lock */
.lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.lock img{height:60px;width:auto}
.lock .lt{font-size:17px;font-weight:600;letter-spacing:-.01em}
.lock .ls{font-size:13px;color:var(--muted);margin-top:-8px;min-height:18px;text-align:center}
.lock .ls.bad{color:var(--bad)}
.dots{display:flex;gap:14px;margin:4px 0 8px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--gold-deep)}
.dots i.on{background:var(--gold-deep)}
.dots.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.kp{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px}
.kp button{width:76px;height:76px;border-radius:50%;border:0;background:#F4F0E6;font-size:28px;color:var(--ink);-webkit-tap-highlight-color:transparent}
.kp button:active{background:var(--gold)}
.kp .gh{background:none;font-size:22px;color:var(--muted)}
.kp .gh:active{background:none}
/* time charts */
.cback{margin:-4px 0 6px}
.cbtn{margin-top:22px}
.cctl{position:sticky;top:0;z-index:3;background:var(--bg);padding:2px 0 8px;border-bottom:1px solid var(--hair)}
.zm{display:flex;gap:2px;background:#F1EEE6;border-radius:11px;padding:2px}
.zb{flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:500 13px var(--font-body)}
.zb[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.ovw{margin-top:8px;height:46px;touch-action:none;cursor:ew-resize}
.ovw svg{display:block}
.crng{font-size:12px;color:var(--muted);text-align:center;margin-top:2px;font-variant-numeric:tabular-nums}
.cc{margin-top:18px}
.cc .ch{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 11px;border-radius:999px;border:1px solid var(--hair);background:#fff;color:var(--ink);font:500 12.5px var(--font-body)}
.chip i{width:10px;height:10px;border-radius:50%;flex:none}
.chip[aria-pressed="false"]{color:var(--muted);background:#F7F5EF}
.chip[aria-pressed="false"] i{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--muted)}
.plot{position:relative;touch-action:pan-y;margin-top:6px}
.plot svg{display:block}
.ax{font:11px var(--font-body);fill:var(--muted);font-variant-numeric:tabular-nums}
.tip{position:absolute;top:4px;z-index:2;pointer-events:none;background:rgba(255,255,255,.96);border:1px solid var(--hair);border-radius:10px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px rgba(43,35,20,.12);white-space:nowrap}
.tip .d{color:var(--muted);margin-bottom:2px}
.tip .r{display:flex;align-items:center;gap:6px}
.tip .r i{width:8px;height:8px;border-radius:50%;flex:none}
.tip b{font-weight:600;font-variant-numeric:tabular-nums}
</style>

<script>
// <pure>
const pad=n=>String(n).padStart(2,'0');
const fmtDMY=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
const fmtDM=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1);
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;};
const daysBetween=(a,b)=>Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/86400000);
function parseDMY(s){const m=/^\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s*$/.exec(s==null?'':String(s));return m?m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]):null;}
function parseNum(s){
  if(typeof s==='number')return isFinite(s)?s:null;
  if(s==null)return null;
  let t=String(s).replace(/[^\d,.\-]/g,'');
  if(!/\d/.test(t))return null;
  if(t.includes(',')&&t.includes('.'))t=t.replace(/\./g,'').replace(',','.');
  else if(t.includes(','))t=t.replace(',','.');
  else if((t.match(/\./g)||[]).length>1)t=t.replace(/\./g,'');
  const n=parseFloat(t);return isNaN(n)?null:n;
}
const fmtVND=n=>new Intl.NumberFormat('vi-VN').format(Math.round(n))+' đ';
const fmtN=(n,dec)=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:dec==null?2:dec}).format(n);
const minutesOf=s=>{const m=/^(\d{1,2}):(\d{2})/.exec(s==null?'':String(s));return m?(+m[1]*60+ +m[2]):null;};
function avgBedtime(list){
  if(!list.length)return null;
  const adj=list.map(m=>m<720?m+1440:m);
  const avg=Math.round(adj.reduce((a,b)=>a+b,0)/adj.length)%1440;
  return pad(Math.floor(avg/60))+':'+pad(avg%60);
}
const WEEK1=new Date(2026,0,5);
const weekNo=s=>Math.max(0,Math.floor(daysBetween(WEEK1,s)/7)+1);
function periodOf(mode,off,t){
  if(mode==='week'){
    const mon=addDays(t,-((t.getDay()+6)%7));
    const s=addDays(mon,7*off),e=addDays(s,6);
    return {mode:mode,s:s,e:e,label:'Tuần '+weekNo(s),range:fmtDM(s)+' – '+fmtDM(e)};
  }
  if(mode==='month'){

function header(title,sub,back){
  return '<header class="hd"><img src="'+LOGO_SRC+'" alt="Dragon Hub"><div class="grow"><div class="brand">DRAGON HUB</div><div class="sub">'+esc(sub)+'</div></div>'+(back?'<button class="linkbtn" data-act="toorg">‹ Sơ đồ</button>':'')+'</header>';
}
function treeHTML(report){
  const nodeHTML=n=>{
    const has=!!n.g;
    let inner;
    if(report){
      inner='<button type="button" class="node '+n.cls+(S.sel===n.id?' sel':'')+'" data-act="open" data-n="'+n.id+'"><span class="t"><span>'+esc(n.name)+'</span><span class="cap">'+(has?'Bấm để xem báo cáo':'Chưa có số liệu')+'</span></span><span class="go" aria-hidden="true">›</span></button>';
    }else{
      inner='<a class="node '+n.cls+'" href="'+esc(n.url)+'" target="_blank" rel="noopener"><span class="t"><span>'+esc(n.name)+'</span></span><span class="go" aria-hidden="true">↗</span></a>';
    }
    return inner;
  };
  const kidsHTML=n=>n.kids&&n.kids.length?'<ul class="kids">'+n.kids.map(k=>'<li>'+nodeHTML(k)+kidsHTML(k)+'</li>').join('')+'</ul>':'';
  const root=NODES[0];
  return '<div class="root">'+nodeHTML(root)+kidsHTML(root)+'</div>';
}
function periodControls(){
  const t=today(),p=periodOf(S.mode,S.off,t);
  return '<div class="seg" role="group" aria-label="Chọn kỳ báo cáo">'+MODES.map(m=>'<button type="button" data-act="mode" data-m="'+m[0]+'" aria-pressed="'+(S.mode===m[0])+'">'+m[1]+'</button>').join('')+'</div>'+
    '<div class="pnav"><button type="button" class="iconbtn" data-act="pprev" aria-label="Kỳ trước">‹</button><div class="p"><span class="h3">'+esc(p.label)+'</span><span class="small muted num">'+esc(p.range)+'</span></div><button type="button" class="iconbtn" data-act="pnext" aria-label="Kỳ sau"'+(S.off>=0?' disabled':'')+'>›</button></div>';
}
function sheetHTML(){
  if(!S.sel)return '';
  const n=FLAT[S.sel];
  let body;
  if(!n.g){
    body='<div class="empty"><div class="h3">Chưa có số liệu</div><p class="muted small" style="margin-top:6px">Sheet này chưa có số theo ngày để tính báo cáo.</p></div>';
  }else if(S.loading||(!S.data&&!S.err)){
    body='<p class="muted" style="text-align:center;padding:32px 0"><span class="spin"></span> Đang đọc sheet…</p>';
  }else if(S.err){
    const i=errInfo(S.err);
    body='<div class="empty"><div class="h3">'+esc(i.t)+'</div><p class="muted small" style="margin:6px 0 12px">'+esc(i.m)+'</p>'+'<button type="button" class="btn" data-act="'+i.btn+'">'+esc(i.lbl)+'</button>'+'</div>';
  }else{
    if(S.cv)body='<div class="cback"><button type="button" class="linkbtn" data-act="chartsback">‹ Báo cáo</button></div><div id="cv"></div>';
    else body=periodControls()+reportFor(n.g)+'<div class="cbtn"><button type="button" class="btn block" data-act="charts">Xem biểu đồ theo thời gian</button></div>';
  }
  if(!n.g)body+='';
  return '<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Báo cáo '+esc(n.name)+'">'+
    '<div class="sh-hd '+n.cls+'"><div class="nm">'+esc(n.name)+(n.g?'<div class="sc">'+SOGRP_LABEL[n.g]+'</div>':'')+'</div><button type="button" class="iconbtn" id="shclose" data-act="close" aria-label="Đóng">×</button></div>'+
    '<div class="sh-bd" id="shbd">'+(n.g?'':'')+body+'</div></div>';
}
function paint(){
  const el=document.getElementById('app');if(!el)return;
  const sheetOpen=!!S.sel&&S.view==='report';
  const keep=document.getElementById('shbd');const st=keep?keep.scrollTop:0;
  let h='';
  if(S.view==='org'){
    h=header('Sơ đồ','Sơ đồ tổ chức',false)+'<nav class="org" aria-label="Sơ đồ tổ chức Dragon Hub">'+treeHTML(false)+'</nav>'+
      '<div class="actions"><button type="button" class="btn primary" data-act="toreport">Báo cáo thường kì</button></div>'+
      '';
  }else{
    h=header('Báo cáo','Báo cáo thường kì',true)+'<div class="pc">'+periodControls()+'</div><nav class="org" aria-label="Sơ đồ báo cáo">'+treeHTML(true)+'</nav>'+
      ''+(sheetOpen?sheetHTML():'');
  }
  el.innerHTML=h;

const PRESETS=[['7','1w'],['30','1m'],['90','3m'],['180','6m'],['365','1y'],['0','max']];
const FINCOL=[['Tổng đầu ngày',1,'#3D6FD8'],['Tổng cuối ngày',4,'#2E9A4F'],['Dòng vào',2,'#D2452F'],['Dòng ra',3,'#E8920C'],['Nghĩa vụ tài chính',5,'#8E3AA0']];
const PL={l:6,r:48,t:8,b:22};
const OV={h:46,pad:9};
const C={g:null,defs:[],days:[],dates:[],lo:0,hi:0,preset:'30',off:{},cur:null,ov:0};

function keyDate(k){const a=k.split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function timeline(defs,t){
  let first=null;
  defs.forEach(c=>c.series.concat(c.std?[c.std]:[]).forEach(s=>{
    s.map.forEach((r,k)=>{if(first!==null&&k>=first)return;if(parseNum(r[s.col])!==null)first=k;});
  }));
  const days=[],dates=[];
  if(first!==null){for(let d=keyDate(first);d<=t;d=addDays(d,1)){days.push(ymd(d));dates.push(d);}}
  return {days:days,dates:dates};
}
function valsFor(s,days){return days.map(d=>{const r=s.map.get(d);return r?parseNum(r[s.col]):null;});}
function xLabel(d,span){return span>150?pad(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2):fmtDM(d);}
function pathOf(seg,X,Y){return seg.map((p,k)=>(k?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');}
function stepOf(seg,X,Y){let d='',py='';seg.forEach((p,k)=>{const x=X(p[0]).toFixed(1),y=Y(p[1]).toFixed(1);d+=k?('L'+x+' '+py+'L'+x+' '+y):('M'+x+' '+y);py=y;});return d;}
function fmtVal(def,v,s){if(def.money)return fmtN(v,0)+' đ';const u=s&&s.unit!=null?s.unit:def.unit,d=s&&s.dec!=null?s.dec:def.dec;return fmtN(v,d)+' '+u;}
function tipRow(color,name,val){return '<div class="r"><i style="background:'+color+'"></i>'+(name?esc(name)+' ':'')+'<b>'+val+'</b></div>';}
function drawPlot(i){
  const def=C.defs[i],el=document.getElementById('plot-'+i);
  if(!def||!el)return;
  const W=Math.max(240,el.clientWidth||320),H=def.money?240:190;
  const lo=C.lo,hi=C.hi,n=hi-lo,iw=W-PL.l-PL.r;
  const act=[];def.series.forEach((s,k)=>{if(!C.off[k])act.push({s:s,k:k});});
  let mn=0,mx=0;
  act.map(o=>o.s.vals).concat(def.std?[def.std.vals]:[]).forEach(a=>{for(let j=lo;j<=hi;j++){const v=a[j];if(v!=null){if(v<mn)mn=v;if(v>mx)mx=v;}}});
  const sc=niceScale(mn,mx,4);
  const X=j=>PL.l+(n>0?(j-lo)/n:0)*iw,Y=v=>PL.t+(1-(v-sc.min)/(sc.max-sc.min))*(H-PL.t-PL.b);
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Biểu đồ '+esc(def.title)+' từ '+fmtDMY(C.dates[lo])+' đến '+fmtDMY(C.dates[hi])+'">';
  sc.ticks.forEach(v=>{
    const y=Y(v);
    s+='<line x1="'+PL.l+'" x2="'+(W-PL.r)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+(v===0?'#CFC6B0':'#EEE9DC')+'" stroke-width="1"/><text class="ax" x="'+(W-PL.r+6)+'" y="'+(y+4).toFixed(1)+'">'+compactNum(v)+'</text>';
  });

  }
  if(def.std)segments(def.std.vals,lo,hi).forEach(sg=>{s+='<path d="'+stepOf(sg,X,Y)+'" fill="none" stroke="#A89C80" stroke-width="1.5" stroke-dasharray="5 4"/>';});
  act.forEach(o=>{
    segments(o.s.vals,lo,hi).forEach(sg=>{
      if(sg.length===1){s+='<circle cx="'+X(sg[0][0]).toFixed(1)+'" cy="'+Y(sg[0][1]).toFixed(1)+'" r="2.6" fill="'+o.s.color+'"/>';return;}
      const d=o.s.step?stepOf(sg,X,Y):pathOf(sg,X,Y);
      if(!def.money&&def.series.length===1)s+='<path d="'+d+'L'+X(sg[sg.length-1][0]).toFixed(1)+' '+Y(0).toFixed(1)+'L'+X(sg[0][0]).toFixed(1)+' '+Y(0).toFixed(1)+'Z" fill="'+o.s.color+'" fill-opacity=".10"/>';
      s+='<path d="'+d+'" fill="none" stroke="'+o.s.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    });
  });
  let tip='';
  if(C.cur&&C.cur.ci===i&&C.cur.j>=lo&&C.cur.j<=hi){
    const j=C.cur.j,x=X(j),names=def.series.length>1||!!def.std;
    s+='<line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+PL.t+'" y2="'+(H-PL.b)+'" stroke="#8F6D2E" stroke-opacity=".5" stroke-width="1"/>';
    let rows='';
    act.forEach(o=>{
      const v=o.s.vals[j];
      if(v!=null){
        s+='<circle cx="'+x.toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="4" fill="#fff" stroke="'+o.s.color+'" stroke-width="2"/>';
        rows+=tipRow(o.s.color,names?o.s.name:'',fmtVal(def,v,o.s));
      }
    });
    if(def.std){const v=def.std.vals[j];if(v!=null)rows+=tipRow('#A89C80',def.std.name,fmtVal(def,v));}
    tip='<div class="tip" style="'+(x>W/2?'right:'+(W-x+8).toFixed(0)+'px':'left:'+(x+8).toFixed(0)+'px')+'"><div class="d">'+fmtDMY(C.dates[j])+'</div>'+(rows||'<div class="muted">Chưa có số liệu</div>')+'</div>';
  }
  el.innerHTML=s+'</svg>'+tip;
}
function ovW(el){return Math.max(240,el.clientWidth||320);}
function ovX(j,W){const t=C.days.length;return OV.pad+(t>1?j/(t-1):0)*(W-2*OV.pad);}
function ovJ(x,W){const t=C.days.length;return Math.max(0,Math.min(t-1,Math.round((x-OV.pad)/(W-2*OV.pad)*(t-1))));}
function drawOvw(){
  const el=document.getElementById('ovw');if(!el)return;
  const W=ovW(el),H=OV.h,vals=C.defs[0].series[C.ov].vals;
  let mx=0,mn=0;
  vals.forEach(v=>{if(v!=null){if(v>mx)mx=v;if(v<mn)mn=v;}});
  if(!(mx>mn))mx=mn+1;
  const X=j=>ovX(j,W),Y=v=>5+(1-(v-mn)/(mx-mn))*(H-12);
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">';
  segments(vals,0,C.days.length-1).forEach(sg=>{
    if(sg.length<2)return;
    const d=pathOf(sg,X,Y);
    s+='<path d="'+d+'L'+X(sg[sg.length-1][0]).toFixed(1)+' '+Y(0).toFixed(1)+'L'+X(sg[0][0]).toFixed(1)+' '+Y(0).toFixed(1)+'Z" fill="#C9A460" fill-opacity=".18"/>';
    s+='<path d="'+d+'" fill="none" stroke="#8F6D2E" stroke-width="1.2" stroke-opacity=".8"/>';
  });
  const xl=X(C.lo),xh=X(C.hi);
  s+='<rect x="0" y="0" width="'+xl.toFixed(1)+'" height="'+H+'" fill="#fff" fill-opacity=".72"/><rect x="'+xh.toFixed(1)+'" y="0" width="'+Math.max(0,W-xh).toFixed(1)+'" height="'+H+'" fill="#fff" fill-opacity=".72"/>';
  s+='<rect x="'+xl.toFixed(1)+'" y="1" width="'+Math.max(0,xh-xl).toFixed(1)+'" height="'+(H-2)+'" fill="none" stroke="#8F6D2E" stroke-width="1.5"/>';
  [xl,xh].forEach(x=>{
    s+='<rect x="'+(x-6).toFixed(1)+'" y="'+(H/2-14)+'" width="12" height="28" rx="5" fill="#8F6D2E"/><line x1="'+(x-1.5).toFixed(1)+'" x2="'+(x-1.5).toFixed(1)+'" y1="'+(H/2-6)+'" y2="'+(H/2+6)+'" stroke="#fff" stroke-width="1.2"/><line x1="'+(x+1.5).toFixed(1)+'" x2="'+(x+1.5).toFixed(1)+'" y1="'+(H/2-6)+'" y2="'+(H/2+6)+'" stroke="#fff" stroke-width="1.2"/>';
  });
  el.innerHTML=s+'</svg>';
}
function drawAll(){
  C.defs.forEach((_,i)=>drawPlot(i));
  drawOvw();
  const r=document.getElementById('crng');

function applyPreset(z){const total=C.days.length,n=+z;C.hi=total-1;C.lo=n>0?Math.max(0,total-n):0;C.preset=z;}
function zoomTo(z){if(!C.days.length)return;applyPreset(z);C.cur=null;drawAll();}
function toggleSer(si){
  const k=+si,def=C.defs[0];if(!def)return;
  const on=def.series.filter((s,j)=>!C.off[j]).length;
  if(!C.off[k]&&on<=1)return;

  const b=document.querySelector('.chip[data-si="'+k+'"]');

  drawPlot(0);

function plotPtr(e,i){
  const el=document.getElementById('plot-'+i);if(!el)return;
  const r=el.getBoundingClientRect(),n=C.hi-C.lo,iw=r.width-PL.l-PL.r;
  let j=C.lo+Math.round((e.clientX-r.left-PL.l)/iw*n);
  j=Math.max(C.lo,Math.min(C.hi,j));
  if(C.cur&&C.cur.ci===i&&C.cur.j===j)return;
  const prev=C.cur;C.cur={ci:i,j:j};
  if(prev&&prev.ci!==i)drawPlot(prev.ci);
  drawPlot(i);

function initCharts(){
  const host=document.getElementById('cv');
  if(!host||!S.sel||!S.data)return;
  const n=FLAT[S.sel];if(!n||!n.g)return;
  const defs=chartDefs(n.g,S.data),tl=timeline(defs,today());
  if(C.g!==n.g){C.off={};C.preset='30';C.cur=null;}
  C.g=n.g;C.defs=defs;C.days=tl.days;C.dates=tl.dates;C.ov=defs[0].ov||0;
  if(!C.days.length){host.innerHTML='<div class="empty"><div class="h3">Chưa có số liệu</div><p class="muted small" style="margin-top:6px">Chưa có ngày nào có số để vẽ biểu đồ.</p></div>';return;}
  defs.forEach(c=>{c.series.forEach(s=>{s.vals=valsFor(s,C.days);});if(c.std)c.std.vals=valsFor(c.std,C.days);});
  const total=C.days.length;
  if(C.preset!==null)applyPreset(C.preset);
  else{C.hi=Math.min(C.hi,total-1);C.lo=Math.max(0,Math.min(C.lo,C.hi));}
  let h='<div class="cctl"><div class="zm" role="group" aria-label="Khoảng thời gian">'+PRESETS.map(p=>'<button type="button" class="zb" data-act="zoom" data-z="'+p[0]+'" aria-pressed="false">'+p[1]+'</button>').join('')+'</div><div class="ovw" id="ovw"></div><div class="crng" id="crng"></div></div>';
  defs.forEach((c,i)=>{
    h+='<section class="cc"><div class="ch"><div class="h3">'+esc(c.title)+'</div><span class="small muted">'+esc(c.unit)+'</span></div>';
    if(c.series.length>1)h+='<div class="chips">'+c.series.map((s,k)=>'<button type="button" class="chip" data-act="ser" data-si="'+k+'" aria-pressed="'+(!C.off[k])+'"><i style="background:'+s.color+'"></i>'+esc(s.name)+'</button>').join('')+'</div>';
    h+='<div class="plot" id="plot-'+i+'"></div></section>';
  });
  host.innerHTML=h;
  defs.forEach((c,i)=>{
    const el=document.getElementById('plot-'+i),f=e=>plotPtr(e,i);
    el.addEventListener('pointerdown',f);
    el.addEventListener('pointermove',f);
    el.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&C.cur&&C.cur.ci===i){C.cur=null;drawPlot(i);}});
  });
  const ov=document.getElementById('ovw');
  let drag=null;
  const setWin=(e)=>{
    const r=ov.getBoundingClientRect(),j=ovJ(e.clientX-r.left,r.width);
    const w=dragWindow(drag.mode,j,drag.j0,drag.lo0,drag.hi0,C.days.length,Math.min(6,C.days.length-1));
    C.lo=w.lo;C.hi=w.hi;C.preset=null;C.cur=null;drawAll();
  };
  ov.addEventListener('pointerdown',e=>{
    const r=ov.getBoundingClientRect(),x=e.clientX-r.left,xl=ovX(C.lo,r.width),xh=ovX(C.hi,r.width);
    let mode;
    if(Math.abs(x-xl)<=18&&Math.abs(x-xl)<=Math.abs(x-xh))mode='lo';
    else if(Math.abs(x-xh)<=18)mode='hi';
    else if(x>xl&&x<xh)mode='pan';
    else mode='center';
    drag={mode:mode,j0:ovJ(x,r.width),lo0:C.lo,hi0:C.hi};
    try{ov.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
    if(mode==='center')setWin(e);
  });
  ov.addEventListener('pointermove',e=>{if(drag)setWin(e);});
  const end=()=>{drag=null;};
  ov.addEventListener('pointerup',end);ov.addEventListener('pointercancel',end);
  drawAll();
}
window.addEventListener('resize',()=>{if(S.cv&&S.sel&&C.days.length&&document.getElementById('cv'))drawAll();});

/* ---------- passcode lock ---------- */
const PINK='dh_pin',FAILK='dh_fail';
const hasPin=()=>{try{const p=JSON.parse(ls.get(PINK)||'null');return !!(p&&p.s&&p.h);}catch(e){return false;}};
const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const b64=buf=>btoa(String.fromCharCode.apply(null,new Uint8Array(buf)));
async function hashPin(pin,salt){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},k,256));
}
let lockEl=null,lockCb=null;
function showLock(mode,cb){
  if(!(window.crypto&&crypto.subtle)){if(cb)cb();return;}
  if(lockEl){lockCb=cb||lockCb;return;}
  lockCb=cb||null;
  let m=mode,buf='',first='',msg='',bad=false,busy=false;
  const el=document.createElement('div');el.className='lock';el.setAttribute('role','dialog');el.setAttribute('aria-label','Nhập mã');
  lockEl=el;document.body.appendChild(el);
  const titles={set1:'Tạo mã 6 số cho app',set2:'Nhập lại mã để xác nhận',enter:'Nhập mã'};
  const draw=()=>{
    el.innerHTML='<img src="'+LOGO_SRC+'" alt="">'+
      '<div class="lt">'+titles[m]+'</div><div class="ls'+(bad?' bad':'')+'">'+esc(msg)+'</div>'+
      '<div class="dots" id="dots">'+[0,1,2,3,4,5].map(i=>'<i class="'+(i<buf.length?'on':'')+'"></i>').join('')+'</div>'+
      '<div class="kp">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button type="button" data-k="'+n+'" aria-label="'+n+'">'+n+'</button>').join('')+
      '<button type="button" class="gh" disabled></button><button type="button" data-k="0" aria-label="0">0</button><button type="button" class="gh" data-k="del" aria-label="Xóa">⌫</button></div>';
  };
  const shake=t=>{msg=t;bad=true;buf='';draw();const d=el.querySelector('#dots');if(d){d.classList.add('shake');}};
  const done=()=>{document.removeEventListener('keydown',kd);el.remove();lockEl=null;const c=lockCb;lockCb=null;if(c)c();};
  async function submit(){
    busy=true;
    try{
      if(m==='set1'){first=buf;buf='';m='set2';msg='';bad=false;draw();}
      else if(m==='set2'){
        if(buf!==first){m='set1';first='';shake('Hai lần chưa khớp. Tạo lại mã.');}
        else{
          const salt=crypto.getRandomValues(new Uint8Array(16));
          ls.set(PINK,JSON.stringify({s:b64(salt),h:await hashPin(buf,salt)}));
          done();return;
        }
      }else{
        let f={n:0,until:0};try{f=JSON.parse(ls.get(FAILK)||'null')||f;}catch(e){}
        const wait=Math.ceil((f.until-Date.now())/1000);
        if(wait>0){shake('Thử lại sau '+wait+' giây');busy=false;return;}
        const p=JSON.parse(ls.get(PINK));
        if(await hashPin(buf,u8(p.s))===p.h){ls.del(FAILK);done();return;}
        f.n=(f.n||0)+1;
        if(f.n>=5)f.until=Date.now()+Math.min(900,30*Math.pow(2,f.n-5))*1000;
        ls.set(FAILK,JSON.stringify(f));
        shake(f.n>=5?'Sai nhiều lần. Chờ một lúc rồi thử lại.':'Mã chưa đúng');
      }
    }catch(e){shake('Có lỗi, thử lại');}
    busy=false;
  }
  function key(k){
    if(busy)return;
    if(k==='del'){buf=buf.slice(0,-1);}
    else if(buf.length<6){if(bad){bad=false;msg='';}buf+=k;}
    draw();
    if(buf.length===6)submit();
  }
  function kd(e){if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('del');}
  el.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)key(b.dataset.k);});
  document.addEventListener('keydown',kd);
  draw();
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'&&hasPin()&&!lockEl&&!ss.get('dh_nolock'))showLock('enter',null);
});

/* ---------- start ---------- */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
let lastTap=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTap<350)e.preventDefault();lastTap=n;},{passive:false});
const back=handleReturn();
paint();
if(!back)showLock(hasPin()?'enter':'set1',startSplash);
if(S.view==='report')loadData(false);
})();
</script>
</body></html>
