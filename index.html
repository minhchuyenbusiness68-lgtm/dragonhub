<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CEO Dragon Hub">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>CEO Dragon Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cormorant+Garamond:wght@600;700&display=swap">
<style>
/* Layout: two views share one org tree. "Sơ đồ" has links that open each sheet. "Báo cáo thường kì" has the same tree where each box opens a report sheet for the chosen period (tuần, tháng, quý, năm). Phone: vertical tree with a gold spine. 760px+: horizontal tree. Report opens as a bottom sheet on phones and a centered dialog on wide screens. Light only on purpose: white and muted gold. */
:root{
  --bg:#FFFFFF;
  --surface:#FAF8F3;
  --surface-2:#F2EDE0;
  --ink:#2B2314;
  --muted:#6E6552;
  --line:#C9A460;
  --hair:#E7E0CE;
  --gold:#C9A460;
  --gold-deep:#8F6D2E;
  --gold-soft:#F6EFDD;
  --ok:#3F7A4E;
  --bad:#A5473A;
  --warn:#9A5B1B;
  --n-board:#D9B872;
  --n-brand:#BFDDE2;
  --n-fin:#D3D1CC;
  --n-inv:#F1CFA2;
  --n-nw:#F8E6CC;
  --n-legal:#EDEBE6;
  --edge:rgba(43,35,20,.14);
  --font-display:'Cormorant Garamond','Iowan Old Style',Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;min-height:100vh;-webkit-text-size-adjust:100%;
}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 40px;min-width:0}
h1,h2,h3,p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold-deep);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.ok{color:var(--ok)}
.bad{color:var(--bad)}
.warn{color:var(--warn)}

.hd{display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.hd img{height:52px;width:auto;display:block;flex:none}
.hd .grow{flex:1;min-width:0}
.brand{font-family:var(--font-display);font-weight:700;letter-spacing:.07em;font-size:21px;color:var(--gold-deep);line-height:1.1}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.linkbtn{background:none;border:0;padding:8px 0;color:var(--gold-deep);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:44px}
.btn{min-height:48px;border-radius:10px;padding:12px 18px;border:1px solid var(--gold-deep);background:var(--bg);color:var(--gold-deep);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.block{width:100%}

/* tree */
.org{margin-top:24px}
ul{list-style:none;margin:0;padding:0}
.node{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:60px;padding:10px 14px;border-radius:10px;width:100%;text-align:left;
  border:1px solid var(--edge);text-decoration:none;color:var(--ink);font-weight:600;font-size:13.5px;letter-spacing:.03em;line-height:1.3;
  transition:transform .15s ease,box-shadow .15s ease}
.node:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(43,35,20,.12)}
.node:active{transform:translateY(0)}
.node .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.node .cap{font-size:12px;font-weight:500;letter-spacing:0;color:var(--muted)}
.node .go{font-size:16px;color:var(--gold-deep);flex:none;font-weight:500}
.node.sel{outline:2px solid var(--gold-deep);outline-offset:2px}
.board{background:var(--n-board)}
.brandn{background:var(--n-brand)}
.fin{background:var(--n-fin)}
.inv{background:var(--n-inv)}
.nw{background:var(--n-nw)}
.legal{background:var(--n-legal)}

.kids{margin:12px 0 0 22px;padding-left:22px}
.kids>li{position:relative;margin-top:12px}
.kids>li:first-child{margin-top:0}
.kids>li::before{content:"";position:absolute;left:-22px;top:-12px;width:2px;height:calc(100% + 12px);background:var(--line)}
.kids>li:last-child::before{height:calc(30px + 12px)}
.kids>li::after{content:"";position:absolute;left:-22px;top:30px;width:22px;height:2px;background:var(--line)}

.actions{margin-top:26px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--hair);display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:space-between}
.foot .hint{font-size:13px;color:var(--muted)}
.foot a{font-size:14px;font-weight:600;color:var(--gold-deep);text-underline-offset:3px}

/* period controls */
.seg{display:flex;border:1px solid var(--gold);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:44px;background:var(--bg);border:0;color:var(--gold-deep);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink);font-weight:600}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 2px}
.pnav .p{text-align:center;min-width:0}
.pnav .p .h3{display:block;font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1.15}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--hair);background:var(--bg);display:grid;place-items:center;font-size:18px;color:var(--gold-deep);flex:none}
.iconbtn[disabled]{opacity:.35;cursor:default}
.pc{margin-top:20px;max-width:560px;margin-inline:auto}

/* report sheet */
.scrim{position:fixed;inset:0;background:rgba(43,35,20,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:16px 16px 0 0;max-height:90vh;display:flex;flex-direction:column;
  box-shadow:0 -8px 30px rgba(43,35,20,.25);animation:up .25s ease both}
.sheet .sh-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-radius:16px 16px 0 0;border-bottom:1px solid var(--edge)}
.sheet .sh-hd .nm{font-weight:600;letter-spacing:.03em;font-size:14px;min-width:0}
.sheet .sh-hd .sc{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}
.sheet .sh-bd{overflow:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(600px,92vw);max-height:86vh;transform:translate(-50%,-50%);border-radius:16px;animation:pop .2s ease both}
  .sheet .sh-hd{border-radius:16px 16px 0 0}
}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}to{opacity:1;transform:translate(-50%,-50%)}}

.mgrp{margin-top:18px}
.mgrp>.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);font-weight:600;margin-bottom:4px}
.m{padding:12px 0;border-top:1px solid var(--hair)}
.m:first-of-type{border-top:0}
.m .mt{font-weight:600}
.m .mv{font-family:var(--font-display);font-size:34px;font-weight:600;line-height:1.1;font-variant-numeric:lining-nums tabular-nums;overflow-wrap:anywhere}
.m .mv .mu{font-family:var(--font-body);font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
.mrow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:2px 0}
.mrow span{color:var(--muted)}
.mrow b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
.bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:999px}
.note{background:var(--gold-soft);border:1px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
.empty{padding:24px 0;text-align:center}
.empty .h3{font-family:var(--font-display);font-size:26px;font-weight:600}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--gold);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

@media (min-width:760px){
  .root{display:flex;flex-direction:column;align-items:center}
  .root>.node{width:min(320px,100%)}
  .kids{display:flex;justify-content:center;gap:16px;margin:0;padding:24px 0 0;width:100%;position:relative}
  .kids::before{content:"";position:absolute;left:50%;top:0;width:2px;height:24px;margin-left:-1px;background:var(--line)}
  .kids>li{flex:1 1 0;min-width:0;max-width:230px;margin:0;padding-top:24px;position:relative;display:flex;flex-direction:column}
  .kids>li:first-child{margin:0}
  .kids>li::before{left:-8px;right:-8px;top:0;width:auto;height:2px;background:var(--line)}
  .kids>li:first-child::before{left:50%;top:0;height:2px}
  .kids>li:last-child::before{left:-8px;right:50%;height:2px}
  .kids>li:only-child::before{display:none}
  .kids>li::after{left:50%;top:0;width:2px;height:24px;margin-left:-1px}
  .kids .kids{padding-top:24px;margin:0;width:100%;justify-content:center}
  .kids .kids::before{height:24px}
  .kids .kids>li{padding-top:0;max-width:none}
  .kids .kids>li::before,.kids .kids>li::after{display:none}
  .node{min-height:72px}
  .actions{flex-direction:row;justify-content:center}
  .actions .btn{min-width:260px}
}

/* opening animation */
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  animation:spOut .45s ease 3.1s forwards;cursor:pointer}
.splash .stage{position:relative;width:264px;height:264px;display:grid;place-items:center}
.splash .ringw{position:absolute;inset:0;animation:ringOut .5s ease 1.55s forwards}
.splash .ringw::before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid var(--gold-soft)}
.splash .ring{position:absolute;inset:0;animation:spin 1.8s cubic-bezier(.4,.1,.25,1) both}
.splash .trail{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(201,164,96,0) 0deg,rgba(201,164,96,0) 190deg,rgba(201,164,96,.95) 360deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}
.splash .head{position:absolute;top:-5px;left:calc(50% - 7px);width:14px;height:14px;border-radius:50%;background:#F6E3A8;box-shadow:0 0 16px 5px rgba(201,164,96,.75)}
.splash .mark2{position:relative;height:178px;width:auto;opacity:0;animation:reveal .9s cubic-bezier(.2,.7,.2,1) 1.4s forwards}
.splash .tap{position:absolute;bottom:max(24px,env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);letter-spacing:.06em}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(720deg)}}
@keyframes ringOut{to{opacity:0;transform:scale(.8)}}
@keyframes reveal{0%{opacity:0;clip-path:circle(0% at 50% 50%);transform:scale(.88)}25%{opacity:1}100%{opacity:1;clip-path:circle(80% at 50% 50%);transform:scale(1)}}
@keyframes word{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){
  .node{transition:none}
  .sheet{animation:none}
  .spin{animation:none}
}

/* apple-like refinements */
body{letter-spacing:-.003em}
.node{justify-content:center;text-align:center;position:relative;padding:12px 34px;border-radius:14px;border-color:transparent;box-shadow:0 1px 2px rgba(43,35,20,.08)}
.node .t{align-items:center}
.node .go{position:absolute;right:14px;top:50%;transform:translateY(-50%)}
.seg{background:#F1EEE6;border:0;border-radius:11px;padding:2px;gap:2px}
.seg button{min-height:38px;border-radius:9px;background:transparent;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.pnav .p .h3,.empty .h3{font-family:var(--font-body);font-weight:600;font-size:21px;letter-spacing:-.015em}
.sheet{border-radius:20px 20px 0 0}
.sheet .sh-hd{border-radius:20px 20px 0 0}
.tw{overflow-x:auto;margin:16px -4px 0;-webkit-overflow-scrolling:touch}
.tb{border-collapse:separate;border-spacing:0;width:100%;min-width:max-content;font-size:14px}
.tb th,.tb td{padding:12px 8px;border-bottom:1px solid var(--hair);white-space:nowrap;text-align:right;font-weight:400}
.tb thead th{font-size:12px;color:var(--muted);font-weight:500;padding-top:6px;padding-bottom:8px}
.tb th:first-child{text-align:left;position:sticky;left:0;background:var(--bg);font-weight:600;white-space:normal;min-width:84px;max-width:100px;z-index:1;box-shadow:6px 0 8px -8px rgba(43,35,20,.18)}
.tb thead th:first-child{font-weight:500}
.tb th small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.tb td{font-variant-numeric:tabular-nums}
.tb td.t1{font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.pill.up{color:#2F7D57;background:rgba(52,168,110,.13)}
.pill.down{color:#B2503F;background:rgba(214,90,70,.13)}
.pill.flat{color:var(--muted);background:#F1EEE6}
.kv{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair);font-size:14px}
.kv span{color:var(--muted)}
.kv b{font-weight:600}
.tt{margin:22px 0 0;font-size:13px;font-weight:600;color:var(--gold-deep)}
.cov{margin:14px 0 0;text-align:center;font-size:12.5px;color:var(--muted)}

/* app-like: no zoom, no rubber-band, no text selection */
html{touch-action:manipulation;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}
/* passcode lock */
.lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.lock img{height:60px;width:auto}
.lock .lt{font-size:17px;font-weight:600;letter-spacing:-.01em}
.lock .ls{font-size:13px;color:var(--muted);margin-top:-8px;min-height:18px;text-align:center}
.lock .ls.bad{color:var(--bad)}
.dots{display:flex;gap:14px;margin:4px 0 8px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--gold-deep)}
.dots i.on{background:var(--gold-deep)}
.dots.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.kp{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px}
.kp button{width:76px;height:76px;border-radius:50%;border:0;background:#F4F0E6;font-size:28px;color:var(--ink);-webkit-tap-highlight-color:transparent}
.kp button:active,.kp button.pr{background:var(--gold)}
.kp .gh{background:none;font-size:22px;color:var(--muted)}
.kp .gh:active{background:none}
/* fixed screen: page never scrolls, only the report panel does */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;min-height:0}
.wrap{height:100%;display:flex;flex-direction:column;overflow:hidden;padding-block:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-bottom,0px))}
.wrap>.hd{flex:none}
.wrap>.org,.wrap>.pc,.wrap>.actions{flex:none}
.wrap>.pc{width:100%}
.sheet .sh-bd{overscroll-behavior:contain}
@media (max-height:780px){.org{margin-top:14px}.pc{margin-top:12px}.node{min-height:48px;padding-top:7px;padding-bottom:7px}.kids{margin-top:8px}.kids>li{margin-top:8px}.actions{margin-top:14px}.hd{padding-bottom:10px}.hd img{height:44px}}
@media (max-height:640px){.node{min-height:42px;font-size:12.5px}.node .cap{display:none}.pnav .p .h3{font-size:22px}.iconbtn{width:38px;height:38px}}
.qbtn{margin-left:auto;align-self:center;flex:none;width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--gold-deep);background:transparent;color:var(--gold-deep);border-radius:50%;padding:0}
.hd .brand{white-space:nowrap}
.qe-f .btn[hidden]{display:none}
#qroot .scrim{z-index:59}
.qe{position:fixed;left:12px;right:12px;top:max(56px,calc(env(safe-area-inset-top) + 40px));z-index:60;background:var(--bg);border-radius:16px;padding:14px;box-shadow:0 12px 40px rgba(43,35,20,.25);max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 80px);overflow:auto}
.qe-h{display:flex;align-items:center;justify-content:space-between;font-weight:700;color:var(--gold-deep)}
.qe textarea{width:100%;font:16px/1.4 var(--font-body);border:1px solid var(--hair);border-radius:12px;padding:10px 12px;resize:none;color:var(--ink);background:#fff;-webkit-user-select:text;user-select:text}
.qe-d{display:flex;gap:6px}
.qp{font-size:14px;display:flex;flex-direction:column;gap:3px}
.qp .qs{font-weight:700;color:var(--gold-deep);font-size:12px;margin-top:4px}
.qp .qr{display:flex;justify-content:space-between;gap:10px}
.qp .qr b{font-variant-numeric:tabular-nums}
.qp .qw{color:#C0301E}
.qp .qn{color:var(--muted);font-size:12px}
.qe-f{display:flex;gap:10px}.qe-f .btn{flex:1}
.qe-f .btn[disabled]{opacity:.45}
/* trang chủ: không cuộn */
.wrap>.home{flex:1 1 0;min-height:0}
.wrap>.hacts{flex:none}
.home{display:flex;flex-direction:column;gap:8px;margin-top:10px;overflow:hidden}
.cd{flex:none;border-radius:16px;padding:12px 16px 12px;color:#F3E9D2;background:radial-gradient(120% 140% at 100% 0,rgba(210,69,47,.38),transparent 55%),linear-gradient(135deg,#2B2314,#3A2E18);display:flex;flex-direction:column;gap:7px}
.cd-r{display:flex;align-items:center;gap:14px}
.cd-n{font:700 56px/1 var(--font-body);letter-spacing:-.03em;color:var(--gold);font-variant-numeric:tabular-nums}
.cd-t{display:flex;flex-direction:column;gap:3px;min-width:0}
.cd-k{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600}
.cd-k i{width:8px;height:8px;border-radius:50%;background:#E5432E;box-shadow:0 0 0 3px rgba(229,67,46,.28);animation:cdp 1.6s ease-in-out infinite}
@keyframes cdp{50%{box-shadow:0 0 0 6px rgba(229,67,46,0)}}
.cd-s{font-size:12.5px;color:#CDBE9C}
.cd-b{height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.cd-b b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#C9A460,#E5432E)}
.cd-f{display:flex;justify-content:space-between;font-size:11.5px;color:#CDBE9C}
.hp{flex:none;display:flex;flex-direction:column;gap:3px;border:1px solid var(--hair);border-radius:14px;padding:6px 10px 6px;background:var(--bg)}
.hp-h{display:flex;align-items:center;justify-content:space-between;gap:6px;flex:none}
.hp-t{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--gold-deep);white-space:nowrap}
.rw{display:grid;grid-template-columns:78px 1fr 40px;align-items:center;gap:8px;margin-top:5px;font-size:12.5px}
.rw .tr{height:18px;border-radius:99px;background:#F1EEE6;overflow:hidden;position:relative}
.rw .tr b{display:block;height:100%;border-radius:99px}

<script>
// <pure>
const pad=n=>String(n).padStart(2,'0');
const fmtDMY=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
const fmtDM=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1);
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;};
const daysBetween=(a,b)=>Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/86400000);
function parseDMY(s){const m=/^\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s*$/.exec(s==null?'':String(s));return m?m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]):null;}
function parseNum(s){
  if(typeof s==='number')return isFinite(s)?s:null;
  if(s==null)return null;
  let t=String(s).replace(/[^\d,.\-]/g,'');
  if(!/\d/.test(t))return null;
  if(t.includes(',')&&t.includes('.'))t=t.replace(/\./g,'').replace(',','.');
  else if(t.includes(','))t=t.replace(',','.');
  else if((t.match(/\./g)||[]).length>1)t=t.replace(/\./g,'');
  const n=parseFloat(t);return isNaN(n)?null:n;
}
const fmtVND=n=>new Intl.NumberFormat('vi-VN').format(Math.round(n))+' đ';
const fmtN=(n,dec)=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:dec==null?2:dec}).format(n);
const minutesOf=s=>{const m=/^(\d{1,2}):(\d{2})/.exec(s==null?'':String(s));return m?(+m[1]*60+ +m[2]):null;};
function avgBedtime(list){
  if(!list.length)return null;
  const adj=list.map(m=>m<720?m+1440:m);
  const avg=Math.round(adj.reduce((a,b)=>a+b,0)/adj.length)%1440;
  return pad(Math.floor(avg/60))+':'+pad(avg%60);
}
const WEEK1=new Date(2026,0,5);
const weekNo=s=>Math.max(0,Math.floor(daysBetween(WEEK1,s)/7)+1);
function periodOf(mode,off,t){
  if(mode==='day'){
    const s=addDays(t,off),wd=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'][s.getDay()];
    return {mode:mode,s:s,e:s,label:off===0?'Hôm nay':off===-1?'Hôm qua':wd,range:wd+' · '+fmtDMY(s)};
  }
  if(mode==='week'){
    const mon=addDays(t,-((t.getDay()+6)%7));
    const s=addDays(mon,7*off),e=addDays(s,6);
    return {mode:mode,s:s,e:e,label:'Tuần '+weekNo(s),range:fmtDM(s)+' – '+fmtDM(e)};
  }
  if(mode==='month'){
    const s=new Date(t.getFullYear(),t.getMonth()+off,1),e=new Date(s.getFullYear(),s.getMonth()+1,0);
    return {mode:mode,s:s,e:e,label:'Tháng '+(s.getMonth()+1)+'/'+s.getFullYear(),range:fmtDM(s)+' – '+fmtDM(e)};
  }
  if(mode==='quarter'){
    const idx=t.getFullYear()*4+Math.floor(t.getMonth()/3)+off;
    const y=Math.floor(idx/4),qq=idx%4;
    const s=new Date(y,qq*3,1),e=new Date(y,qq*3+3,0);
    return {mode:mode,s:s,e:e,label:'Quý '+(qq+1)+'/'+y,range:fmtDM(s)+' – '+fmtDM(e)};
  }
  const y=t.getFullYear()+off;
  const s=new Date(y,0,1),e=new Date(y,11,31);
  return {mode:mode,s:s,e:e,label:'Năm '+y,range:fmtDM(s)+' – '+fmtDM(e)};
}
function elapsedOf(p,t){
  const end=p.e<t?p.e:t;
  return end<p.s?0:daysBetween(p.s,end)+1;
}
function prevWindow(p,off,t){
  const n=elapsedOf(p,t);
  const p2=periodOf(p.mode,off-1,t);
  const len=Math.min(n,daysBetween(p2.s,p2.e)+1);
  return {s:p2.s,n:len};
}
function mapRows(rows){const m=new Map();(rows||[]).forEach(r=>{const k=parseDMY(r&&r[0]);if(k&&!m.has(k))m.set(k,r);});return m;}
function sumRange(map,col,s,n){
  let sum=0,cnt=0;
  for(let i=0;i<n;i++){
    const r=map.get(ymd(addDays(s,i)));
    const v=r?parseNum(r[col]):null;
    if(v!=null){sum+=v;cnt++;}
  }
  return {sum:sum,cnt:cnt};
}
function lastValue(map,col,s,n){
  for(let i=n-1;i>=0;i--){
    const r=map.get(ymd(addDays(s,i)));
    const v=r?parseNum(r[col]):null;
    if(v!=null&&v!==0)return v;
  }
  return null;
}
function bedtimes(map,col,s,n){
  const out=[];
  for(let i=0;i<n;i++){const r=map.get(ymd(addDays(s,i)));const m=r?minutesOf(r[col]):null;if(m!=null)out.push(m);}
  return out;
}
function stdSum(map,col,s,len,fb){
  let sum=0;
  for(let i=0;i<len;i++){const r=map.get(ymd(addDays(s,i)));const v=r?parseNum(r[col]):null;sum+=(v!=null&&v>0)?v:fb;}
  return sum;
}
// ngày Kế toán chỉ tính là đã nhập khi có đầu ngày, hoặc dòng vào, hoặc dòng ra > 0
function finFilled(r){return !!r&&(parseNum(r[1])!=null||parseNum(r[2])!=null||(parseNum(r[3])||0)>0);}
function lastFilled(map,col,s,n,ok){
  for(let i=n-1;i>=0;i--){
    const r=map.get(ymd(addDays(s,i)));
    if(!ok(r))continue;
    const v=parseNum(r[col]);
    if(v!=null)return v;
  }
  return null;
}
function countFilled(map,s,n,ok){let c=0;for(let i=0;i<n;i++)if(ok(map.get(ymd(addDays(s,i)))))c++;return c;}
function pctChange(cur,prev){return prev>0?(cur-prev)/prev:null;}
function niceScale(min,max,n){
  if(!(max>min))max=min+n;
  const raw=(max-min)/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag;
  const step=(f<=1?1:f<=2?2:f<=5?5:10)*mag;
  const lo=Math.floor(min/step+1e-9)*step,hi=Math.ceil(max/step-1e-9)*step;
  const ticks=[];
  for(let v=lo;v<=hi+step/2;v+=step)ticks.push(Math.round(v/step)*step);
  return {min:lo,max:hi,ticks:ticks};
}
function compactNum(n){
  const a=Math.abs(n),s=n<0?'-':'';
  const r=(x,u)=>s+String(parseFloat(x.toFixed(1))).replace('.',',')+' '+u;
  if(a>=1e9)return r(a/1e9,'tỷ');
  if(a>=1e6)return r(a/1e6,'tr');
  return s+fmtN(a,0);
}
function segments(vals,lo,hi){
  const out=[];let cur=null;
  for(let i=lo;i<=hi;i++){
    const v=vals[i];
    if(v==null){cur=null;continue;}
    if(!cur){cur=[];out.push(cur);}
    cur.push([i,v]);
  }
  return out;
}
function dragWindow(mode,j,j0,lo0,hi0,total,minLen){
  const last=total-1,len=hi0-lo0;
  let lo=lo0,hi=hi0;
  if(mode==='lo'){lo=Math.max(0,Math.min(j,hi0-minLen));}
  else if(mode==='hi'){hi=Math.min(last,Math.max(j,lo0+minLen));}
  else if(mode==='pan'){lo=Math.max(0,Math.min(last-len,lo0+(j-j0)));hi=lo+len;}
  else{lo=Math.max(0,Math.min(last-len,j-Math.round(len/2)));hi=lo+len;}
  return {lo:lo,hi:hi};
}
/* ---- Ghi nhanh: đọc câu tiếng Việt (không dùng AI) ---- */
const QF={
  ceo:{tab:'DAILY',dcol:'C',first:2,last:400,cols:{book:['D','Trang sách'],run:['E','Km chạy'],sets:['F','Set tập'],read:['G','Đọc to mục tiêu'],sleep:['H','Giờ ngủ'],rel:['I','Quan hệ mới']},zero:['book','run','sets','read']},
  sale:{tab:'MESURE',dcol:'B',first:2,last:1000,cols:{calls:['D','Tiếp cận'],leads:['E','Quan tâm'],appt:['F','Lịch hẹn'],meet:['G','Cuộc gặp'],deal:['H','Deal']},zero:['calls','leads','appt','meet','deal']}
};
const QSHEET={book:'ceo',run:'ceo',sets:'ceo',read:'ceo',sleep:'ceo',rel:'ceo',calls:'sale',leads:'sale',appt:'sale',meet:'sale',deal:'sale'};
const QKPI={book:25,run:1,sets:12,read:1};
const fold=s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
const NW={khong:0,mot:1,hai:2,ba:3,bon:4,nam:5,lam:5,sau:6,bay:7,tam:8,chin:9};
const hasNW=w=>Object.prototype.hasOwnProperty.call(NW,w);
function wordsToDigits(s){
  const t=s.split(/\s+/).filter(Boolean),out=[];
  let i=0;
  while(i<t.length){
    let v=0,k=i,used=false;
    if(hasNW(t[k])&&t[k+1]==='tram'){v+=NW[t[k]]*100;k+=2;used=true;}
    else if(t[k]==='tram'){v+=100;k++;used=true;}
    if(used&&(t[k]==='linh'||t[k]==='le')&&hasNW(t[k+1])){v+=NW[t[k+1]];k+=2;}
    else if(hasNW(t[k])&&t[k+1]==='muoi'){v+=NW[t[k]]*10;k+=2;used=true;if(hasNW(t[k])||t[k]==='tu'){v+=t[k]==='tu'?4:NW[t[k]];k++;}}
    else if(t[k]==='muoi'){v+=10;k++;used=true;if(hasNW(t[k])||t[k]==='tu'){v+=t[k]==='tu'?4:NW[t[k]];k++;}}
    else if(!used&&hasNW(t[k])){v+=NW[t[k]];k++;used=true;}
    if(used){out.push(String(v));i=k;}else{out.push(t[i]);i++;}
  }
  return out.join(' ');
}
const QKW={trang:'book',sach:'book',km:'run',cay:'run',chay:'run',set:'sets',sets:'sets',tap:'sets',quanhe:'rel',deal:'deal',chot:'deal',hen:'appt',gap:'meet',goi:'calls',tiepcan:'calls',sdt:'calls',quantam:'leads'};
const QUNIT=new Set(['trang','km','cay','set','sets','quanhe','deal','hen','gap','sdt']);
const QFILL=new Set(['luc','duoc','la','khoang','da','vua','co','minh']);
const QFILLN=new Set(['cuoc','nguoi','khach','lan','so','cai']);
const isNum=w=>/^\d+(\.\d+)?$/.test(w);
function parseQuick(text){
  const res={day:0,preset:false,items:[],unknown:[]};
  let s=fold(text).replace(/(\d)[,.](\d)/g,'$1#$2').replace(/[,;.!?\n\r]+/g,' ').replace(/%/g,' % ').replace(/(\d)([a-z])/g,'$1 $2').replace(/([a-z])(\d)/g,'$1 $2');
  s=s.replace(/\s+/g,' ').trim();
  if(/\bhom qua\b/.test(s)){res.day=-1;s=s.replace(/\bhom qua\b/g,' ');}
  else if(/\bhom kia\b/.test(s)){res.day=-2;s=s.replace(/\bhom kia\b/g,' ');}
  else s=s.replace(/\bhom nay\b/g,' ');
  s=s.replace(/\btiep can\b/g,'tiepcan').replace(/\bquan tam\b/g,'quantam').replace(/\bquan he\b/g,'quanhe').replace(/\bmuc tieu\b/g,'muctieu').replace(/\blich hen\b/g,'hen').replace(/\bcuoc hen\b/g,'hen').replace(/\bcuoc gap\b/g,'gap').replace(/\bso dien thoai\b/g,'sdt').replace(/\b(?:di ngu|ngu luc|ngu vao luc|ngu vao)\b/g,'ngu');
  s=wordsToDigits(s).replace(/(\d+)\s+ruoi\b/g,(m,a)=>/\b(?:gio|h)\b/.test(m)?m:a+'#5');
  // hoàn thành 100% KPI
  const pre=/(?:hoan thanh|xong|dat|du)\s+(?:het\s+|toan bo\s+|tat ca\s+)?(?:100\s*%|muctieu|kpi|chi tieu)(?:\s+(?:ceo|kpi|muctieu|chi tieu))*|100\s*%\s*(?:kpi|muctieu|chi tieu)(?:\s+ceo)?|kpi\s+ceo\s+100\s*%/;
  if(pre.test(s)){res.preset=true;s=s.replace(pre,' ');}
  // giờ ngủ
  const sl=/\bngu\b(?:\s+(?:luc|vao|khoang|la))?\s+(\d{1,2})(?:\s*(?::|#|h|gio)\s*(?:(\d{1,2})(?!\d)(?!\s+(?:trang|km|cay|set|sets|sdt|quanhe|deal|hen|gap))|(ruoi))?)?(?:\s+(sang|toi|dem)\b)?/.exec(s);
  if(sl){
    let hr=+sl[1];const mn=sl[3]?30:sl[2]==null?0:+sl[2];
    s=s.replace(sl[0],' ');
    if(hr>23||mn>59)res.unknown.push('Giờ ngủ không hợp lệ');
    else{
      if(sl[4]==='toi'&&hr<12)hr+=12;
      else if((sl[4]==='dem'||sl[4]==='sang')&&hr===12)hr=0;
      else if(!sl[4]&&hr>=8&&hr<=11)hr+=12;
      res.items.push({key:'sleep',sheet:'ceo',val:pad(hr)+':'+pad(mn),mode:'set'});
    }
  }
  // đọc to mục tiêu
  const rd=/\bdoc\b(?:\s+to)?\s+muctieu(?:\s+(\d+))?/.exec(s);
  if(rd){res.items.push({key:'read',sheet:'ceo',val:rd[1]?+rd[1]:1,mode:'add'});s=s.replace(rd[0],' ');}
  // ghép số với từ khóa
  const t=s.split(' ').filter(Boolean).map(w=>w.replace('#','.'));
  const used=new Array(t.length).fill(false),got={};
  const take=(key,v,i,j)=>{
    got[key]=(got[key]||0)+v;
    used[i]=true;
    for(let k=Math.max(0,j-2);k<=Math.min(t.length-1,j+2);k++)if(QKW[t[k]]===key)used[k]=true;
  };
  for(let i=0;i<t.length;i++){
    if(!isNum(t[i]))continue;
    const v=parseFloat(t[i]);
    let p=i-1;if(p>=0&&QFILL.has(t[p]))p--;
    if(p>=0&&QKW[t[p]]&&!used[p]){take(QKW[t[p]],v,i,p);continue;}
    let n=i+1;if(n<t.length&&QFILLN.has(t[n]))n++;
    if(n<t.length&&QUNIT.has(t[n])&&!used[n]){take(QKW[t[n]],v,i,n);continue;}
    if(t[i+1]==='%'||t[i-1]==='%'){used[i]=true;continue;}
    used[i]=true;res.unknown.push('Số '+t[i]+' không rõ thuộc mục nào');
  }
  Object.keys(got).forEach(k=>{
    if(!QSHEET[k])return;
    res.items.push({key:k,sheet:QSHEET[k],val:Math.round(got[k]*100)/100,mode:'add'});
  });
  if(res.preset){
    Object.keys(QKPI).forEach(k=>{if(!res.items.some(x=>x.key===k))res.items.push({key:k,sheet:'ceo',val:QKPI[k],mode:'atleast'});});
  }
  // từ khóa không đi kèm số (trừ động từ chung)
  return res;
}
function planCell(mode,cur,val){
  const c=cur==null?0:cur;
  let n=mode==='add'?c+val:mode==='atleast'?Math.max(c,val):val;
  return typeof n==='number'?Math.round(n*100)/100:n;
}
// cur: {key:{num:số|null,raw:giá trị thô,f:có công thức}}; trả về danh sách ô cần ghi
function planSheet(sheet,items,cur){
  const F=QF[sheet],out=[];
  items.filter(x=>x.sheet===sheet).forEach(x=>{
    const c=cur[x.key]||{num:null,raw:'',f:false};
    out.push({key:x.key,label:F.cols[x.key][1],col:F.cols[x.key][0],prev:c.raw,cur:c.num,next:x.mode==='set'?x.val:planCell(x.mode,c.num,x.val),mode:x.mode,val:x.val,formula:!!c.f,def:false});
  });
  if(out.length)F.zero.forEach(k=>{

function deltaHTML(cur,prev,lowerBetter){
  const ch=prev==null?null:pctChange(cur,prev);
  if(ch==null)return '<span class="muted">—</span>';
  const up=ch>0.0005,down=ch<-0.0005;
  if(!up&&!down)return '<span class="pill flat">0%</span>';
  const good=lowerBetter?down:up;
  return '<span class="pill '+(good?'up':'down')+'">'+(up?'▲':'▼')+' '+fmtN(Math.abs(ch)*100,0)+'%</span>';
}
function tbl(head,rows,bi){

  return '<div class="tw"><table class="tb"><thead><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+

function metricRow(o){
  const dec=o.dec==null?0:o.dec,f=v=>fmtN(v,dec);

function header(title,sub,back,brand,right){
  return '<header class="hd"><img src="'+LOGO_SRC+'" alt="Dragon Hub"><div class="grow"><div class="brand">'+(brand||'DRAGON HUB')+'</div><div class="sub">'+esc(sub)+'</div></div>'+(back?'<button class="linkbtn" data-act="tohome">‹ Trang chủ</button>':'')+(right||'')+'</header>';
}
function treeHTML(report){
  const nodeHTML=n=>{
    const has=!!n.g;
    let inner;
    if(report){
      inner='<button type="button" class="node '+n.cls+(S.sel===n.id?' sel':'')+'" data-act="open" data-n="'+n.id+'"><span class="t"><span>'+esc(n.name)+'</span><span class="cap">'+(has?'Bấm để xem báo cáo':'Chưa có số liệu')+'</span></span><span class="go" aria-hidden="true">›</span></button>';
    }else{
      inner='<a class="node '+n.cls+'" href="'+esc(n.url)+'" target="_blank" rel="noopener"><span class="t"><span>'+esc(n.name)+'</span></span><span class="go" aria-hidden="true">↗</span></a>';
    }
    return inner;
  };
  const kidsHTML=n=>n.kids&&n.kids.length?'<ul class="kids">'+n.kids.map(k=>'<li>'+nodeHTML(k)+kidsHTML(k)+'</li>').join('')+'</ul>':'';
  const root=NODES[0];
  return '<div class="root">'+nodeHTML(root)+kidsHTML(root)+'</div>';
}
function periodControls(){
  const t=today(),p=periodOf(S.mode,S.off,t);
  return '<div class="seg" role="group" aria-label="Chọn kỳ báo cáo">'+MODES.map(m=>'<button type="button" data-act="mode" data-m="'+m[0]+'" aria-pressed="'+(S.mode===m[0])+'">'+m[1]+'</button>').join('')+'</div>'+
    '<div class="pnav"><button type="button" class="iconbtn" data-act="pprev" aria-label="Kỳ trước">‹</button><div class="p"><span class="h3">'+esc(p.label)+'</span><span class="small muted num">'+esc(p.range)+'</span></div><button type="button" class="iconbtn" data-act="pnext" aria-label="Kỳ sau"'+(S.off>=0?' disabled':'')+'>›</button></div>';
}
function sheetBody(n){
  let body;
  if(!n.g){
    body='<div class="empty"><div class="h3">Chưa có số liệu</div><p class="muted small" style="margin-top:6px">Sheet này chưa có số theo ngày để tính báo cáo.</p></div>';
  }else if(S.loading||(!S.data&&!S.err)){
    body='<p class="muted" style="text-align:center;padding:32px 0"><span class="spin"></span> Đang đọc sheet…</p>';
  }else if(S.err){
    const i=errInfo(S.err);
    body='<div class="empty"><div class="h3">'+esc(i.t)+'</div><p class="muted small" style="margin:6px 0 12px">'+esc(i.m)+'</p>'+'<button type="button" class="btn" data-act="'+i.btn+'">'+esc(i.lbl)+'</button>'+'</div>';
  }else{
    if(S.cv)body='<div class="cback"><button type="button" class="linkbtn" data-act="chartsback">‹ Báo cáo</button></div><div id="cv"></div>';
    else body=periodControls()+reportFor(n.g)+'<div class="cbtn"><button type="button" class="btn block" data-act="charts">Xem biểu đồ theo thời gian</button></div>';
  }
  return body;
}
function sheetHTML(){
  if(!S.sel)return '';
  const n=FLAT[S.sel];
  const body=sheetBody(n);
  return '<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Báo cáo '+esc(n.name)+'">'+
    '<div class="sh-hd '+n.cls+'"><div class="nm">'+esc(n.name)+(n.g?'<div class="sc">'+SOGRP_LABEL[n.g]+'</div>':'')+'</div><button type="button" class="iconbtn" id="shclose" data-act="close" aria-label="Đóng">×</button></div>'+
    '<div class="sh-bd" id="shbd">'+(n.g?'':'')+body+'</div></div>';
}
const YT={book:9125,run:261,sets:3129};   // chỉ tiêu cả năm 2026: 25 trang/ngày, 5 km/tuần, 12 set/ngày x 5 ngày/tuần = 60 set/tuần
function ytdSum(map,col){
  const y=String(today().getFullYear());let t=0;
  map.forEach((r,k)=>{if(k.slice(0,4)===y){const v=parseNum(r[col]);if(v!=null)t+=v;}});
  return t;
}
function countdownHTML(){
  const t=today(),end=new Date(t.getFullYear(),11,31),start=new Date(t.getFullYear(),0,1);
  const left=Math.round((end-t)/864e5),tot=Math.round((end-start)/864e5)+1,day=tot-left,pc=Math.round(day/tot*100);

/* ---------- time charts ---------- */
const PRESETS=[['7','1w'],['30','1m'],['90','3m'],['180','6m'],['365','1y'],['0','max']];
const FINCOL=[['Tổng đầu ngày',1,'#3D6FD8','Đầu ngày'],['Tổng cuối ngày',4,'#2E9A4F','Cuối ngày'],['Dòng vào',2,'#D2452F'],['Dòng ra',3,'#E8920C'],['Nghĩa vụ tài chính',5,'#8E3AA0','Nghĩa vụ']];
const CHS={};      // cài đặt từng biểu đồ (khoảng thời gian, đường bật/tắt) giữ lại giữa các lần vẽ
const HSV={preset:'30',lo:0,hi:0};   // thanh kéo chung của trang chủ
let CI=[];         // các biểu đồ đang hiển thị
function chartDefs(g,D){
  const B='#3D6FD8',O='#E8920C',R='#D2452F',G='#2E9A4F';
  if(g==='ceo')return [{title:'Số liệu CEO',unit:'',dec:0,ov:0,series:[
    {name:'Số trang sách đọc',map:D.ceo,col:1,color:B,unit:'trang',dec:0},
    {name:'Số set tập',map:D.ceo,col:3,color:O,unit:'set',dec:0},
    {name:'Số km chạy',map:D.ceo,col:2,color:R,unit:'km',dec:1}]}];
  if(g==='sale')return [{title:'Số liệu Sale',unit:'',dec:0,ov:1,series:[
    {name:'Tiêu chuẩn',short:'Tiêu chuẩn',map:D.sale,col:1,color:B,unit:'SĐT',dec:0,step:true},
    {name:'Số SĐT tiếp cận',short:'Tiếp cận',map:D.sale,col:2,color:R,unit:'SĐT',dec:0},
    {name:'KH quan tâm',short:'Quan tâm',map:D.sale,col:3,color:O,unit:'khách',dec:0},
    {name:'Lịch hẹn',short:'Hẹn',map:D.sale,col:4,color:'#8E3AA0',unit:'lịch',dec:0},
    {name:'Cuộc gặp',short:'Gặp',map:D.sale,col:5,color:G,unit:'cuộc',dec:0},
    {name:'Deal',short:'Deal',map:D.sale,col:6,color:'#2B2314',unit:'deal',dec:0}]}];
  return [{title:'Thu chi và dòng tiền',unit:'đồng',money:true,dec:0,ov:1,series:FINCOL.map(f=>({name:f[0],short:f[3],map:D.flow,col:f[1],color:f[2],ok:finFilled}))}];
}
function keyDate(k){const a=k.split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function timeline(defs,t){
  let first=null;
  defs.forEach(c=>c.series.forEach(s=>{
    s.map.forEach((r,k)=>{if(first!==null&&k>=first)return;if(parseNum(r[s.col])!==null)first=k;});
  }));
  const days=[],dates=[];
  if(first!==null){for(let d=keyDate(first);d<=t;d=addDays(d,1)){days.push(ymd(d));dates.push(d);}}
  return {days:days,dates:dates};
}
function valsFor(s,days){return days.map(d=>{const r=s.map.get(d);if(!r||(s.ok&&!s.ok(r)))return null;return parseNum(r[s.col]);});}
function xLabel(d,span){return span>150?pad(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2):fmtDM(d);}
function pathOf(seg,X,Y){return seg.map((p,k)=>(k?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');}
function stepOf(seg,X,Y){let d='',py='';seg.forEach((p,k)=>{const x=X(p[0]).toFixed(1),y=Y(p[1]).toFixed(1);d+=k?('L'+x+' '+py+'L'+x+' '+y):('M'+x+' '+y);py=y;});return d;}
function fmtVal(def,v,s){if(def.money)return fmtN(v,0)+' đ';const u=s&&s.unit!=null?s.unit:def.unit,d=s&&s.dec!=null?s.dec:def.dec;return fmtN(v,d)+' '+u;}
function tipRow(color,name,val){return '<div class="r"><i style="background:'+color+'"></i>'+(name?esc(name)+' ':'')+'<b>'+val+'</b></div>';}

/* thanh kéo chọn khoảng thời gian: vẽ + kéo */
const OVP=9;
const ovX=(j,W,total)=>OVP+(total>1?j/(total-1):0)*(W-2*OVP);
const ovJ=(x,W,total)=>Math.max(0,Math.min(total-1,Math.round((x-OVP)/(W-2*OVP)*(total-1))));
function drawOvSvg(el,vals,total,lo,hi,Hdef,plain){
  const W=Math.max(240,el.clientWidth||320),H=Math.max(18,el.clientHeight||Hdef);
  let mx=0,mn=0;
  vals.forEach(v=>{if(v!=null){if(v>mx)mx=v;if(v<mn)mn=v;}});
  if(!(mx>mn))mx=mn+1;
  const X=j=>ovX(j,W,total),Y=v=>4+(1-(v-mn)/(mx-mn))*(H-10);
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">';
  if(!plain)segments(vals,0,total-1).forEach(sg=>{
    if(sg.length<2)return;
    const d=pathOf(sg,X,Y);
    s+='<path d="'+d+'L'+X(sg[sg.length-1][0]).toFixed(1)+' '+Y(0).toFixed(1)+'L'+X(sg[0][0]).toFixed(1)+' '+Y(0).toFixed(1)+'Z" fill="#C9A460" fill-opacity=".18"/>';
    s+='<path d="'+d+'" fill="none" stroke="#8F6D2E" stroke-width="1.1" stroke-opacity=".8"/>';
  });
  if(plain)s+='<rect x="'+OVP+'" y="'+(H/2-3)+'" width="'+(W-2*OVP)+'" height="6" rx="3" fill="#F1EEE6"/>';
  const xl=X(lo),xh=X(hi),hh=Math.min(28,H-6),hy=H/2-hh/2,ly=Math.min(6,hh/2-3);
  s+='<rect x="0" y="0" width="'+xl.toFixed(1)+'" height="'+H+'" fill="#fff" fill-opacity=".72"/><rect x="'+xh.toFixed(1)+'" y="0" width="'+Math.max(0,W-xh).toFixed(1)+'" height="'+H+'" fill="#fff" fill-opacity=".72"/>';
  s+='<rect x="'+xl.toFixed(1)+'" y="1" width="'+Math.max(0,xh-xl).toFixed(1)+'" height="'+(H-2)+'" fill="none" stroke="#8F6D2E" stroke-width="1.5"/>';
  [xl,xh].forEach(x=>{
    s+='<rect x="'+(x-6).toFixed(1)+'" y="'+hy+'" width="12" height="'+hh+'" rx="5" fill="#8F6D2E"/><line x1="'+(x-1.5).toFixed(1)+'" x2="'+(x-1.5).toFixed(1)+'" y1="'+(H/2-ly)+'" y2="'+(H/2+ly)+'" stroke="#fff" stroke-width="1.2"/><line x1="'+(x+1.5).toFixed(1)+'" x2="'+(x+1.5).toFixed(1)+'" y1="'+(H/2-ly)+'" y2="'+(H/2+ly)+'" stroke="#fff" stroke-width="1.2"/>';
  });
  el.innerHTML=s+'</svg>';
}
function bindSlider(el,total,sv,onWin,flag){
  let drag=null;
  const setWin=e=>{
    const r=el.getBoundingClientRect(),j=ovJ(e.clientX-r.left,r.width,total);
    const w=dragWindow(drag.mode,j,drag.j0,drag.lo0,drag.hi0,total,Math.min(6,total-1));
    sv.lo=w.lo;sv.hi=w.hi;sv.preset=null;onWin();
  };
  el.addEventListener('pointerdown',e=>{
    const r=el.getBoundingClientRect(),x=e.clientX-r.left,xl=ovX(sv.lo,r.width,total),xh=ovX(sv.hi,r.width,total);
    let mode;
    if(Math.abs(x-xl)<=18&&Math.abs(x-xl)<=Math.abs(x-xh))mode='lo';
    else if(Math.abs(x-xh)<=18)mode='hi';
    else if(x>xl&&x<xh)mode='pan';
    else mode='center';
    drag={mode:mode,j0:ovJ(x,r.width,total),lo0:sv.lo,hi0:sv.hi};flag(true);
    try{el.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
    if(mode==='center')setWin(e);
  });
  el.addEventListener('pointermove',e=>{if(drag)setWin(e);});
  const end=()=>{drag=null;flag(false);};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

/* Một biểu đồ đường độc lập.
   compact=true: bản gọn ở trang chủ; false: bản đầy đủ trong báo cáo.
   SH: dùng chung thanh kéo của trang chủ (không có thanh kéo riêng) */
function mkChart(host,g,compact,title,SH){
  const defs=chartDefs(g,S.data),def=defs[0],tl=SH?SH.tl:timeline(defs,today());
  const sv=SH?SH.sv:(CHS[g+(compact?'H':'S')]||(CHS[g+(compact?'H':'S')]={preset:'30',lo:0,hi:0}));
  const offs=CHS[g+'off']||(CHS[g+'off']={});
  const K={host:host,drag:false,cur:null,redraw:function(){}};
  CI.push(K);
  const days=tl.days,dates=tl.dates,total=days.length;
  if(!total){host.innerHTML='<div class="empty"><div class="h3">Chưa có số liệu</div><p class="muted small" style="margin-top:6px">Chưa có ngày nào có số để vẽ biểu đồ.</p></div>';return K;}
  def.series.forEach(s=>{s.vals=valsFor(s,days);});
  const PL=compact?{l:6,r:42,t:6,b:16}:{l:6,r:48,t:8,b:22};
  const applyPreset=z=>{const n=+z;sv.hi=total-1;sv.lo=n>0?Math.max(0,total-n):0;sv.preset=z;};
  if(!SH){
    if(sv.preset!==null)applyPreset(sv.preset);
    else{sv.hi=Math.min(sv.hi,total-1);sv.lo=Math.max(0,Math.min(sv.lo,sv.hi));}
  }
  const chips=def.series.length>1?'<div class="chips'+(compact?' chips-s':'')+'">'+def.series.map((s,k)=>'<button type="button" class="chip" data-si="'+k+'" aria-pressed="'+(!offs[k])+'"><i style="background:'+s.color+'"></i>'+esc(compact&&s.short?s.short:s.name)+'</button>').join('')+'</div>':'';
  const zm='<div class="zm" role="group" aria-label="Khoảng thời gian">'+PRESETS.map(p=>'<button type="button" class="zb" data-z="'+p[0]+'" aria-pressed="false">'+p[1]+'</button>').join('')+'</div>';
  if(compact)host.innerHTML='<div class="hp-h"><div class="hp-t">'+esc(title)+'</div></div>'+chips+'<div class="plot"></div>';
  else host.innerHTML='<div class="cctl">'+zm+'<div class="ovw"></div><div class="crng"></div></div><section class="cc"><div class="ch"><div class="h3">'+esc(def.title)+'</div><span class="small muted">'+esc(def.unit)+'</span></div>'+chips+'<div class="plot"></div></section>';
  const plotEl=host.querySelector('.plot'),ovEl=host.querySelector('.ovw'),rngEl=host.querySelector('.crng');

  function drawPlot(){
    const W=Math.max(240,plotEl.clientWidth||320);
    const H=compact?Math.max(64,plotEl.clientHeight||110):(def.money?240:190);
    const lo=sv.lo,hi=sv.hi,n=hi-lo,iw=W-PL.l-PL.r;
    const act=[];def.series.forEach((s,k)=>{if(!offs[k])act.push({s:s,k:k});});
    let mn=0,mx=0;
    act.forEach(o=>{for(let j=lo;j<=hi;j++){const v=o.s.vals[j];if(v!=null){if(v<mn)mn=v;if(v>mx)mx=v;}}});
    const sc=niceScale(mn,mx,compact?3:4);
    const X=j=>PL.l+(n>0?(j-lo)/n:0)*iw,Y=v=>PL.t+(1-(v-sc.min)/(sc.max-sc.min))*(H-PL.t-PL.b);
    let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Biểu đồ '+esc(title||def.title)+' từ '+fmtDMY(dates[lo])+' đến '+fmtDMY(dates[hi])+'">';
    sc.ticks.forEach(v=>{
      const y=Y(v);
      s+='<line x1="'+PL.l+'" x2="'+(W-PL.r)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+(v===0?'#CFC6B0':'#EEE9DC')+'" stroke-width="1"/><text class="ax" x="'+(W-PL.r+6)+'" y="'+(y+3.5).toFixed(1)+'">'+compactNum(v)+'</text>';
    });
    for(let k=0;k<4;k++){
      const j=lo+Math.round(n*k/3);
      s+='<text class="ax" x="'+X(j).toFixed(1)+'" y="'+(H-(compact?4:6))+'" text-anchor="'+(k===0?'start':k===3?'end':'middle')+'">'+xLabel(dates[j],n)+'</text>';
    }
    act.forEach(o=>{
      segments(o.s.vals,lo,hi).forEach(sg=>{
        if(sg.length===1){s+='<circle cx="'+X(sg[0][0]).toFixed(1)+'" cy="'+Y(sg[0][1]).toFixed(1)+'" r="2.4" fill="'+o.s.color+'"/>';return;}
        const d=o.s.step?stepOf(sg,X,Y):pathOf(sg,X,Y);
        s+='<path d="'+d+'" fill="none" stroke="'+o.s.color+'" stroke-width="'+(compact?1.8:2)+'" stroke-linejoin="round" stroke-linecap="round"/>';
      });
    });
    let tip='';
    if(K.cur&&K.cur.j>=lo&&K.cur.j<=hi){
      const j=K.cur.j,x=X(j);
      s+='<line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+PL.t+'" y2="'+(H-PL.b)+'" stroke="#8F6D2E" stroke-opacity=".5" stroke-width="1"/>';
      let rows='';
      act.forEach(o=>{
        const v=o.s.vals[j];
        if(v!=null){
          s+='<circle cx="'+x.toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3.6" fill="#fff" stroke="'+o.s.color+'" stroke-width="2"/>';
          rows+=tipRow(o.s.color,o.s.name,fmtVal(def,v,o.s));
        }
      });
      tip='<div class="tip" style="'+(x>W/2?'right:'+(W-x+8).toFixed(0)+'px':'left:'+(x+8).toFixed(0)+'px')+'"><div class="d">'+fmtDMY(dates[j])+'</div>'+(rows||'<div class="muted">Chưa có số liệu</div>')+'</div>';
    }
    plotEl.innerHTML=s+'</svg>'+tip;
  }
  function drawAll(){
    drawPlot();
    if(ovEl)drawOvSvg(ovEl,def.series[def.ov].vals,total,sv.lo,sv.hi,46);
    if(rngEl)rngEl.textContent=fmtDMY(dates[sv.lo])+' – '+fmtDMY(dates[sv.hi])+' · '+(sv.hi-sv.lo+1)+' ngày';
    host.querySelectorAll('.zb').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.z===sv.preset)));
  }
  K.redraw=drawAll;
  host.addEventListener('click',e=>{
    const z=e.target.closest('.zb');
    if(z){applyPreset(z.dataset.z);K.cur=null;drawAll();return;}
    const c=e.target.closest('.chip');
    if(c){
      const k=+c.dataset.si,on=def.series.filter((s,j)=>!offs[j]).length;
      if(!offs[k]&&on<=1)return;
      offs[k]=!offs[k];K.cur=null;
      c.setAttribute('aria-pressed',String(!offs[k]));drawPlot();
    }
  });
  const pp=e=>{
    const r=plotEl.getBoundingClientRect(),n=sv.hi-sv.lo,iw=r.width-PL.l-PL.r;
    let j=sv.lo+Math.round((e.clientX-r.left-PL.l)/iw*n);
    j=Math.max(sv.lo,Math.min(sv.hi,j));
    if(K.cur&&K.cur.j===j)return;
    K.cur={j:j};drawPlot();
  };
  plotEl.addEventListener('pointerdown',pp);
  plotEl.addEventListener('pointermove',pp);
  plotEl.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&K.cur){K.cur=null;drawPlot();}});
  if(ovEl)bindSlider(ovEl,total,sv,()=>{K.cur=null;drawAll();},v=>{K.drag=v;});
  drawAll();
  return K;
}
const anyDrag=()=>CI.some(k=>k.drag);
function initCharts(){            // biểu đồ đầy đủ trong bảng báo cáo
  const host=document.getElementById('cv');
  if(!host||!S.sel||!S.data)return;
  const n=FLAT[S.sel];if(!n||!n.g)return;
  CI=[];mkChart(host,n.g,false);
}
/* trang chủ: Finance + Sale dùng chung một thanh kéo */
function buildHome(){
  CI=[];
  const D=S.data,defF=chartDefs('fin',D),defS=chartDefs('sale',D);
  const tl=timeline(defF.concat(defS),today()),total=tl.days.length;
  const fin=document.querySelector('.hpc[data-g="fin"]'),sale=document.querySelector('.hpc[data-g="sale"]'),ov=document.getElementById('hov');
  if(!total||!fin||!sale||!ov)return;
  const apply=z=>{const n=+z;HSV.hi=total-1;HSV.lo=n>0?Math.max(0,total-n):0;HSV.preset=z;};
  if(HSV.preset!==null)apply(HSV.preset);else{HSV.hi=Math.min(HSV.hi,total-1);HSV.lo=Math.max(0,Math.min(HSV.lo,HSV.hi));}
  const SH={tl:tl,sv:HSV};
  const kids=[mkChart(fin,'fin',true,'Accounting & Finance',SH),mkChart(sale,'sale',true,'Sale',SH)];
  sale.insertAdjacentHTML('beforeend',revHTML());
  const vals=valsFor(defF[0].series[1],tl.days);
  const draw=()=>drawOvSvg(ov,vals,total,HSV.lo,HSV.hi,24,true);
  const onWin=()=>{kids.forEach(k=>{k.cur=null;k.redraw();});draw();};
  bindSlider(ov,total,HSV,onWin,v=>{kids.forEach(k=>{k.drag=v;});});
  draw();
  requestAnimationFrame(()=>{if(ov.isConnected){kids.forEach(k=>{if(k.host.isConnected)k.redraw();});draw();}});
}
window.addEventListener('resize',()=>{CI.forEach(k=>{if(k.host.isConnected)k.redraw();});if(S.view==='home'&&S.data&&!S.err&&document.getElementById('hov'))buildHome();});

/* ---------- auto refresh ---------- */
let refreshing=false;
async function refreshData(){
  if(refreshing||S.loading||(S.view!=='report'&&S.view!=='home')||document.visibilityState!=='visible'||anyDrag()||lockEl)return;
  if(!tokenGet()){
    if(S.data&&ls.get('dh_auth')&&!ss.get('dh_silent'))loadData(true);
    return;
  }
  if(!S.data)return;
  refreshing=true;
  try{
    const r=await fetchAll();
    if(r.sig!==S.sig){
      S.sig=r.sig;S.data=r.data;
      const n=S.sel&&FLAT[S.sel];
      if(S.view==='home'){if(document.querySelector('.hp[data-g]'))buildHome();else paint();}
      else if(n&&n.g){
        if(S.cv)initCharts();
        else{const bd=document.getElementById('shbd');if(bd){const st=bd.scrollTop;bd.innerHTML=sheetBody(n);bd.scrollTop=st;}}
      }
    }
  }catch(e){}
  refreshing=false;
}
setInterval(refreshData,30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setTimeout(refreshData,400);});

/* ---------- Ghi nhanh ---------- */
const qs={open:false,busy:false,dayOv:null,undo:null,msg:null};
const qEl=id=>document.getElementById(id);
async function sheetsCall(url,opt){
  const tok=tokenGet();
  if(!tok)throw {code:'noauth'};
  opt=opt||{};
  opt.headers=Object.assign({Authorization:'Bearer '+tok},opt.headers||{});
  const r=await fetch(url,opt);
  if(r.status===401){ls.del('dh_tok');throw {code:'noauth'};}
  if(!r.ok){let m='';try{const j=await r.json();m=j.error&&j.error.message||'';}catch(e){}throw {code:r.status===403?'denied':'http',message:m,status:r.status};}
  return r.json();
}
async function getRaw(id,range,render){
  const j=await sheetsCall('https://sheets.googleapis.com/v4/spreadsheets/'+id+'/values/'+encodeURIComponent(range)+'?valueRenderOption='+render);
  return j.values||[];
}
async function putCells(id,data){
  const j=await sheetsCall('https://sheets.googleapis.com/v4/spreadsheets/'+id+'/values:batchUpdate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({valueInputOption:'USER_ENTERED',data:data})});
  if(j.totalUpdatedCells!==data.length)throw {code:'http',message:'Google báo ghi '+j.totalUpdatedCells+'/'+data.length+' ô'};
}
function qRender(){
  let r=qEl('qroot');if(!r){r=document.createElement('div');r.id='qroot';document.body.appendChild(r);}
  if(!qs.open){r.innerHTML='';return;}
  r.innerHTML='<div class="scrim" data-act="qclose"></div><div class="qe" role="dialog" aria-label="Ghi nhanh"><div class="qe-h"><span>Ghi nhanh</span><button type="button" class="iconbtn" data-act="qclose" aria-label="Đóng">×</button></div>'+
    '<textarea id="qt" rows="3" placeholder="Nhập thông số cần ghi" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>'+
    '<div class="qe-d"><button type="button" class="chip" data-act="qday" data-d="0" id="qd0">Hôm nay</button><button type="button" class="chip" data-act="qday" data-d="-1" id="qd1">Hôm qua</button></div>'+
    '<div class="qp" id="qp"></div>'+
    '<div class="qe-f"><button type="button" class="btn" id="qundo" data-act="qundo" hidden>Hoàn tác</button><button type="button" class="btn primary" id="qw" data-act="qwrite" disabled>Ghi</button></div></div>';
  qPrev();
}
function qDay(pr){return addDays(today(),qs.dayOv!=null?qs.dayOv:pr.day);}
function qPrev(){
  const ta=qEl('qt'),box=qEl('qp');if(!ta||!box)return;
  const pr=parseQuick(ta.value),day=qDay(pr),off=Math.round((day-today())/864e5);
  qEl('qd0').setAttribute('aria-pressed',String(off===0));qEl('qd1').setAttribute('aria-pressed',String(off===-1));
  qEl('qundo').hidden=!qs.undo;
  let h='';
  if(qs.msg){h+=qs.msg;}
  else if(pr.items.length||pr.unknown.length){
    h+='<div class="qn">Ghi vào ngày '+fmtDMY(day)+'</div>';
    ['ceo','sale'].forEach(sh=>{
      const its=pr.items.filter(x=>x.sheet===sh);if(!its.length)return;
      h+='<div class="qs">'+(sh==='ceo'?'CEO':'Sale')+'</div>';
      its.forEach(x=>{
        const lab=QF[sh].cols[x.key][1],v=x.mode==='add'?'+'+fmtN(x.val,2):x.mode==='atleast'?'đạt '+fmtN(x.val,2):x.val;
        h+='<div class="qr"><span>'+esc(lab)+'</span><b>'+esc(v)+'</b></div>';
      });
    });
    pr.unknown.forEach(u=>{h+='<div class="qr qw">'+esc(u)+'</div>';});
    if(pr.items.length)h+='<div class="qn">Mục không nhắc tới sẽ ghi 0 nếu ô đang trống.</div>';
  }
  box.innerHTML=h;
  qEl('qw').disabled=!pr.items.length||qs.busy;
}
function qOpen(){qs.open=true;qs.msg=null;qs.dayOv=null;qRender();const t=qEl('qt');if(t)t.focus();}
function qClose(){qs.open=false;qs.busy=false;qRender();}
const qMsgErr=e=>{
  if(e&&e.code==='noauth')return '<div class="qr qw">Cần đăng nhập Google lại để cấp quyền ghi sheet.</div><button type="button" class="btn primary" data-act="login">Đăng nhập Google</button>';
  if(e&&e.code==='denied')return '<div class="qr qw">Google chưa cho ghi sheet: '+esc(e.message||'thiếu quyền')+'. Thử đăng nhập lại để cấp quyền sửa sheet.</div><button type="button" class="btn" data-act="login">Đăng nhập Google</button>';
  return '<div class="qr qw">'+esc((e&&e.message)||'Không ghi được, kiểm tra mạng rồi thử lại.')+'</div>';
};
async function qWrite(){
  const ta=qEl('qt');if(!ta||qs.busy)return;
  const pr=parseQuick(ta.value);if(!pr.items.length)return;
  qs.busy=true;qEl('qw').disabled=true;qEl('qp').innerHTML='<div class="qn"><span class="spin"></span> Đang ghi…</div>';
  try{
    const day=qDay(pr),key=ymd(day),plans=[];
    for(const sh of [...new Set(pr.items.map(x=>x.sheet))]){
      const F=QF[sh],id=sh==='ceo'?IDS.ceo:IDS.sale;
      const dc=await getRaw(id,q(F.tab)+'!'+F.dcol+F.first+':'+F.dcol+F.last,'FORMATTED_VALUE');
      let ri=-1;dc.forEach((r,i)=>{if(ri<0&&parseDMY(r&&r[0])===key)ri=i;});
      if(ri<0)throw {code:'norow',message:'Chưa có dòng ngày '+fmtDMY(day)+' trong tab '+F.tab+'. Em không tự tạo dòng mới.'};
      const row=F.first+ri,ks=Object.keys(F.cols),rng=q(F.tab)+'!'+F.cols[ks[0]][0]+row+':'+F.cols[ks[ks.length-1]][0]+row;
      const [fm,fx]=await Promise.all([getRaw(id,rng,'FORMATTED_VALUE'),getRaw(id,rng,'FORMULA')]);
      const cur={};
      ks.forEach((k,i)=>{const raw=(fx[0]||[])[i],f=typeof raw==='string'&&raw.charAt(0)==='=';cur[k]={num:k==='sleep'?null:parseNum((fm[0]||[])[i]),raw:raw==null?'':raw,f:f};});
      const plan=planSheet(sh,pr.items,cur);
      const bf=plan.find(p=>p.formula);
      if(bf)throw {code:'formula',message:'Ô '+bf.label+' đang chứa công thức nên không ghi đè.'};
      const bt=plan.find(p=>p.key!=='sleep'&&!p.def&&p.cur==null&&p.prev!==''&&p.prev!=null);
      if(bt)throw {code:'text',message:'Ô '+bt.label+' đang có nội dung không phải số ('+bt.prev+'), không ghi đè.'};
      plans.push({sh:sh,id:id,F:F,row:row,plan:plan});
    }
    for(const p of plans)await putCells(p.id,p.plan.map(c=>({range:q(p.F.tab)+'!'+c.col+p.row,values:[[c.next]]})));
    qs.undo={plans:plans.map(p=>({id:p.id,tab:p.F.tab,row:p.row,cells:p.plan.map(c=>({col:c.col,prev:c.prev}))}))};
    let h='<div class="qn">Đã ghi vào ngày '+fmtDMY(day)+'</div>';
    plans.forEach(p=>{h+='<div class="qs">'+(p.sh==='ceo'?'CEO':'Sale')+'</div>';p.plan.forEach(c=>{
      h+='<div class="qr"><span>'+esc(c.label)+'</span><b>'+(c.key==='sleep'?esc(c.next):(c.def?'0 (mặc định)':fmtN(c.cur||0,2)+' → '+fmtN(c.next,2)))+'</b></div>';});});
    qs.msg=h;ta.value='';
    qs.busy=false;qPrev();
    try{const r=await fetchAll();S.data=r.data;S.sig=r.sig;if(S.view==='home'&&document.getElementById('hov'))paint();}catch(e){}
  }catch(e){qs.busy=false;qs.msg=qMsgErr(e);qPrev();}
}
async function qUndo(){
  if(!qs.undo||qs.busy)return;
  qs.busy=true;
  try{
    for(const p of qs.undo.plans)await putCells(p.id,p.cells.map(c=>({range:q(p.tab)+'!'+c.col+p.row,values:[[c.prev]]})));
    qs.undo=null;qs.msg='<div class="qn">Đã hoàn tác, trả lại số cũ.</div>';
    qs.busy=false;qPrev();
    try{const r=await fetchAll();S.data=r.data;S.sig=r.sig;if(S.view==='home'&&document.getElementById('hov'))paint();}catch(e){}
  }catch(e){qs.busy=false;qs.msg=qMsgErr(e);qPrev();}
}
document.addEventListener('input',e=>{if(e.target&&e.target.id==='qt'){qs.msg=null;qPrev();}});

/* ---------- actions ---------- */
function setHash(v){}
function act(name,ds){
  switch(name){
    case 'toreport':S.view='report';S.sel=null;setHash('bao-cao');paint();window.scrollTo(0,0);loadData(false);break;
    case 'tohome':S.view='home';S.sel=null;S.cv=false;paint();window.scrollTo(0,0);loadData(false);break;
    case 'toorg':S.view='org';S.sel=null;S.cv=false;setHash('');paint();window.scrollTo(0,0);break;
    case 'open':
      lastFocus=ds.n;S.sel=ds.n;S.cv=false;paint();
      if(FLAT[ds.n].g)loadData(false);
      {const c=document.getElementById('shclose');if(c)c.focus();}
      break;
    case 'close':{
      const id=S.sel;S.sel=null;S.cv=false;paint();
      if(id){const b=document.querySelector('[data-act="open"][data-n="'+id+'"]');if(b)b.focus();}
      break;
    }
    case 'charts':S.cv=true;paint();{const b=document.getElementById('shbd');if(b)b.scrollTop=0;}break;
    case 'chartsback':S.cv=false;paint();{const b=document.getElementById('shbd');if(b)b.scrollTop=0;}break;
    case 'mode':S.mode=ds.m;S.off=0;paint();break;
    case 'pprev':S.off--;paint();break;
    case 'pnext':if(S.off<0){S.off++;paint();}break;
    case 'qopen':qOpen();break;
    case 'qclose':qClose();break;
    case 'qday':qs.dayOv=+ds.d;qs.msg=null;qPrev();break;
    case 'qwrite':qWrite();break;
    case 'qundo':qUndo();break;
    case 'login':login(false);break;
    case 'retry':S.err=null;S.data=null;ss.del('dh_silent');loadData(true);break;
    case 'reload':loadData(true);S.data=null;break;
  }
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  if(b.classList.contains('scrim')&&e.target!==b)return;
  act(b.dataset.act,b.dataset);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(qs.open)qClose();else if(S.sel)act('close',{});}
});

/* ---------- opening animation ---------- */
function startSplash(){
  const el=document.createElement('div');
  el.className='splash';el.id='splash';el.setAttribute('aria-hidden','true');
  el.innerHTML='<div class="stage"><div class="ringw"><div class="ring"><div class="trail"></div><i class="head"></i></div></div><img class="mark2" src="'+LOGO_FULL+'" alt=""></div>';
  document.body.appendChild(el);
  let gone=false;
  const kill=()=>{if(gone)return;gone=true;el.remove();};
  el.addEventListener('click',()=>{el.style.transition='opacity .2s';el.style.opacity='0';setTimeout(kill,220);});
  setTimeout(kill,3700);
}


/* ---------- passcode lock ---------- */
const PINK='dh_pin',FAILK='dh_fail';
const hasPin=()=>{try{const p=JSON.parse(ls.get(PINK)||'null');return !!(p&&p.s&&p.h);}catch(e){return false;}};
const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const b64=buf=>btoa(String.fromCharCode.apply(null,new Uint8Array(buf)));
async function hashPin(pin,salt){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},k,256));
}
let lockEl=null,lockCb=null;
function showLock(mode,cb){
  if(!(window.crypto&&crypto.subtle)){if(cb)cb();return;}
  if(lockEl){lockCb=cb||lockCb;return;}
  lockCb=cb||null;
  let m=mode,buf='',first='',msg='',bad=false,busy=false;
  const el=document.createElement('div');el.className='lock';el.setAttribute('role','dialog');el.setAttribute('aria-label','Nhập mã');
  lockEl=el;document.body.appendChild(el);
  const titles={set1:'Tạo mã 6 số cho app',set2:'Nhập lại mã để xác nhận',enter:'Nhập mã'};
  const draw=()=>{
    if(el.firstChild){
      el.querySelector('.lt').textContent=titles[m];
      const ls=el.querySelector('.ls');ls.textContent=msg;ls.className='ls'+(bad?' bad':'');
      el.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i<buf.length));
      el.querySelector('#dots').classList.remove('shake');
      return;
    }
    el.innerHTML='<img src="'+LOGO_SRC+'" alt="">'+
      '<div class="lt">'+titles[m]+'</div><div class="ls'+(bad?' bad':'')+'">'+esc(msg)+'</div>'+
      '<div class="dots" id="dots">'+[0,1,2,3,4,5].map(i=>'<i class="'+(i<buf.length?'on':'')+'"></i>').join('')+'</div>'+
      '<div class="kp">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button type="button" data-k="'+n+'" aria-label="'+n+'">'+n+'</button>').join('')+
      '<button type="button" class="gh" disabled></button><button type="button" data-k="0" aria-label="0">0</button><button type="button" class="gh" data-k="del" aria-label="Xóa">⌫</button></div>';
  };
  const shake=t=>{msg=t;bad=true;buf='';draw();const d=el.querySelector('#dots');if(d){void d.offsetWidth;d.classList.add('shake');}};
  const done=()=>{document.removeEventListener('keydown',kd);el.remove();lockEl=null;const c=lockCb;lockCb=null;if(c)c();};
  async function submit(){
    busy=true;
    try{
      if(m==='set1'){first=buf;buf='';m='set2';msg='';bad=false;draw();}
      else if(m==='set2'){
        if(buf!==first){m='set1';first='';shake('Hai lần chưa khớp. Tạo lại mã.');}
        else{
          const salt=crypto.getRandomValues(new Uint8Array(16));
          ls.set(PINK,JSON.stringify({s:b64(salt),h:await hashPin(buf,salt)}));
          done();return;
        }
      }else{
        let f={n:0,until:0};try{f=JSON.parse(ls.get(FAILK)||'null')||f;}catch(e){}
        const wait=Math.ceil((f.until-Date.now())/1000);
        if(wait>0){shake('Thử lại sau '+wait+' giây');busy=false;return;}
        const p=JSON.parse(ls.get(PINK));
        if(await hashPin(buf,u8(p.s))===p.h){ls.del(FAILK);done();return;}
        f.n=(f.n||0)+1;
        if(f.n>=5)f.until=Date.now()+Math.min(900,30*Math.pow(2,f.n-5))*1000;
        ls.set(FAILK,JSON.stringify(f));
        shake(f.n>=5?'Sai nhiều lần. Chờ một lúc rồi thử lại.':'Mã chưa đúng');
      }
    }catch(e){shake('Có lỗi, thử lại');}
    busy=false;
  }
  function key(k){
    if(busy)return;
    if(k==='del'){buf=buf.slice(0,-1);}
    else if(buf.length<6){if(bad){bad=false;msg='';}buf+=k;}
    draw();
    if(buf.length===6)submit();
  }
  function kd(e){if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('del');}
  el.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-k]');if(!b)return;e.preventDefault();b.classList.add('pr');setTimeout(()=>b.classList.remove('pr'),120);key(b.dataset.k);});
  document.addEventListener('keydown',kd);
  draw();
}
let hiddenAt=null;const GRACE=120000;
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){hiddenAt=Date.now();return;}
  const away=hiddenAt==null?0:Date.now()-hiddenAt;hiddenAt=null;
  if(away>=GRACE&&hasPin()&&!lockEl&&!ss.get('dh_nolock'))showLock('enter',null);
});

/* ---------- start ---------- */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
let lastTap=0;document.addEventListener('touchend',e=>{if(e.target.closest&&e.target.closest('.lock'))return;const n=Date.now();if(n-lastTap<350)e.preventDefault();lastTap=n;},{passive:false});
const back=handleReturn();
paint();
if(!back||retPre!=='1')showLock(hasPin()?'enter':'set1',startSplash);
if(S.view==='report'||S.view==='home')loadData(false);
})();
</script>
